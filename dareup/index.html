<!doctype html>
<html lang="en" data-dark="0" data-theme="classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fff7f0">
<meta name="description" content="DareUp: a Truth or Dare party game for friends, family and couples. Free packs play offline.">
<title>DareUp</title>
<link rel="icon" href="data:,">
<script>
/* Applies light/dark and the colour theme before first paint. The main script re-applies it. */
(function () {
  try {
    var d = document.documentElement, s = {}, p = null;
    try { s = JSON.parse(localStorage.getItem('dareup.settings') || '{}') || {}; p = JSON.parse(localStorage.getItem('dareup.pass') || 'null'); } catch (e) {}
    var m = s.mode || 'auto';
    var dark = m === 'dark' || (m === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    d.setAttribute('data-dark', dark ? '1' : '0');
    var prem = p && p.token && (p.exp === null || p.exp * 1000 > Date.now());
    d.setAttribute('data-theme', prem && /^(neon|mango|ocean)$/.test(s.theme) ? s.theme : 'classic');
  } catch (e) {}
})();
</script>
<style>
:root{
  --bg:#fff7f0;--surface:#ffffff;--surface-2:#f6f0ff;--text:#1f1535;--muted:#625879;--line:#e9dff6;
  --brand:#7c3aed;--brand-2:#db2777;--brand-ink:#6d28d9;
  --truth-1:#4f46e5;--truth-2:#0284c7;--dare-1:#e11d48;--dare-2:#ea580c;--rand-1:#9333ea;--rand-2:#d97706;
  --ok:#15803d;--bad:#b91c1c;
  --note-bg:#fff3d6;--note-text:#5f3b00;--info-bg:#efeaff;--info-text:#4c1d95;
  --glow-1:rgba(124,58,237,.16);--glow-2:rgba(219,39,119,.13);
  --shadow:0 14px 30px -14px rgba(60,20,120,.38);--shadow-sm:0 4px 14px -6px rgba(60,20,120,.22);
  color-scheme:light;
}
:root[data-dark="1"]{
  --bg:#120c24;--surface:#1c1436;--surface-2:#271d49;--text:#f6f1ff;--muted:#b9aed8;--line:#352a61;
  --brand-ink:#c4b5fd;--note-bg:#3a2a07;--note-text:#fcd58a;--info-bg:#251c4d;--info-text:#d8ccff;
  --glow-1:rgba(124,58,237,.32);--glow-2:rgba(219,39,119,.2);
  --shadow:0 16px 34px -16px rgba(0,0,0,.8);--shadow-sm:0 4px 14px -6px rgba(0,0,0,.6);
  color-scheme:dark;
}
:root[data-theme="neon"]{--bg:#fdf4ff;--brand:#a21caf;--brand-2:#0e7490;--brand-ink:#86198f;--truth-1:#0e7490;--truth-2:#2563eb;--dare-1:#a21caf;--dare-2:#db2777;--rand-1:#7c3aed;--rand-2:#0e7490;--glow-1:rgba(192,38,211,.16);--glow-2:rgba(6,182,212,.16)}
:root[data-theme="neon"][data-dark="1"]{--bg:#0c0619;--surface:#170c2c;--surface-2:#22113f;--line:#3a1f5e;--brand-ink:#f0abfc;--glow-1:rgba(192,38,211,.36);--glow-2:rgba(6,182,212,.26)}
:root[data-theme="mango"]{--bg:#fffaeb;--brand:#c2410c;--brand-2:#b45309;--brand-ink:#c2410c;--truth-1:#0f766e;--truth-2:#0369a1;--dare-1:#dc2626;--dare-2:#c2410c;--rand-1:#b45309;--rand-2:#be123c;--glow-1:rgba(245,158,11,.22);--glow-2:rgba(234,88,12,.14)}
:root[data-theme="mango"][data-dark="1"]{--bg:#1a1206;--surface:#261b0b;--surface-2:#33240f;--line:#4a3517;--brand-ink:#fdba74;--glow-1:rgba(245,158,11,.22);--glow-2:rgba(234,88,12,.2)}
:root[data-theme="ocean"]{--bg:#f0f9ff;--brand:#0369a1;--brand-2:#0f766e;--brand-ink:#075985;--truth-1:#1d4ed8;--truth-2:#0e7490;--dare-1:#be185d;--dare-2:#e11d48;--rand-1:#0f766e;--rand-2:#1d4ed8;--glow-1:rgba(14,165,233,.18);--glow-2:rgba(20,184,166,.16)}
:root[data-theme="ocean"][data-dark="1"]{--bg:#06141f;--surface:#0c2030;--surface-2:#112b40;--line:#1b3d57;--brand-ink:#7dd3fc;--glow-1:rgba(14,165,233,.28);--glow-2:rgba(20,184,166,.22)}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--text);
  font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Ubuntu,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(520px 380px at -10% -5%,var(--glow-1),transparent 70%),radial-gradient(520px 420px at 110% 105%,var(--glow-2),transparent 70%)}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--brand-ink)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top)}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:4px;height:56px;
  padding:0 max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left))}
.bar-side{width:96px;display:flex;align-items:center;gap:2px}
.bar-side.end{justify-content:flex-end}
.bar-title{flex:1;min-width:0;text-align:center;font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.view{max-width:560px;margin:0 auto;padding:4px max(16px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.view>section{animation:enter .28s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* icons + buttons */
.i{display:inline-flex;flex:none}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{width:44px;height:44px;border:0;border-radius:14px;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--text)}
.icon-btn:active{background:var(--surface-2)}
.btn{appearance:none;border:0;border-radius:16px;min-height:52px;padding:10px 20px;font-weight:800;font-size:17px;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;text-decoration:none;text-align:center;
  background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 2px var(--line);transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:var(--shadow)}
.btn-ok{background:linear-gradient(135deg,#15803d,#0f766e);color:#fff;box-shadow:var(--shadow)}
.btn-ghost{background:transparent;box-shadow:none;color:var(--brand-ink);min-height:44px}
.btn-danger{color:var(--bad)}
.btn-block{width:100%}
.btn-lg{min-height:60px;font-size:19px;border-radius:18px}
.btn-sm{min-height:40px;padding:6px 14px;font-size:15px;border-radius:12px}
.btn small{font-weight:600;opacity:.85;font-size:13px}
:focus-visible{outline:3px solid var(--brand-2);outline-offset:2px}

/* layout */
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow-sm)}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec-h h2{font-size:18px;font-weight:900}
.muted{color:var(--muted)}
.fine{font-size:13px;color:var(--muted);text-align:center;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--brand-ink)}
.note{border-radius:16px;padding:12px 14px;font-size:15px;background:var(--note-bg);color:var(--note-text);display:flex;gap:10px;align-items:flex-start}
.note.info{background:var(--info-bg);color:var(--info-text)}
.note .icon{width:20px;height:20px;margin-top:1px}

/* home */
.hero{text-align:center;padding:18px 0 22px}
.logo{width:112px;height:112px;margin:0 auto 12px;filter:drop-shadow(0 16px 24px rgba(124,58,237,.35));animation:bob 4s ease-in-out infinite}
.logo svg{width:100%;height:100%}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.brand-name{font-size:46px;font-weight:900;letter-spacing:-.02em;line-height:1.05;background:linear-gradient(120deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{color:var(--muted);margin-top:8px;font-size:17px}
.tile{border:0;border-radius:18px;background:var(--surface);box-shadow:var(--shadow-sm);min-height:84px;padding:12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;font-weight:800;text-align:left}
.tile .i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--brand-ink)}
.tile:active{transform:scale(.97)}
.tile.hot .i{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff}

/* players */
.add-row{display:flex;gap:8px}
.input{width:100%;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:10px 14px;font-size:17px}
.input:focus{border-color:var(--brand);outline:none}
textarea.input{min-height:160px;resize:vertical;line-height:1.5}
.players{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.player{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:6px 6px 6px 8px;box-shadow:var(--shadow-sm)}
.player .nm{flex:1;min-width:0;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player .icon-btn{width:40px;height:40px}
.avatar{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:900;font-size:17px;background:var(--av,#7c3aed)}
.avatar.big{width:76px;height:76px;font-size:34px;box-shadow:var(--shadow);margin:0 auto}
.field-err{color:var(--bad);font-size:14px;font-weight:700;margin-top:6px}

/* packs */
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pack{position:relative;border:0;text-align:left;cursor:pointer;border-radius:18px;padding:12px 12px 12px 16px;min-height:118px;background:var(--surface);
  box-shadow:var(--shadow-sm),inset 0 0 0 2px transparent;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.pack::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--pc)}
.pack.on{box-shadow:var(--shadow-sm),inset 0 0 0 3px var(--pc)}
.pack.locked{opacity:.78}
.pack-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.pack-name{font-weight:900;font-size:16px;line-height:1.2}
.pack-desc{font-size:13px;color:var(--muted);line-height:1.3}
.pack-meta{margin-top:auto;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.tick{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--pc);color:#fff}
.tick .icon{width:16px;height:16px;stroke-width:3}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:900;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--brand-ink);text-transform:uppercase;letter-spacing:.03em}
.badge .icon{width:12px;height:12px;stroke-width:3}
.badge.adult{background:#e11d48;color:#fff}
.badge.lock{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff}
.group-label{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 8px}

/* segmented + switches */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 0;min-width:56px;min-height:46px;border:0;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);font-weight:800;cursor:pointer;padding:6px 10px}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:none}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:6px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .lbl{font-weight:800}
.set-row .sub{font-size:13px;color:var(--muted);font-weight:500}
.switch{width:58px;height:34px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:linear-gradient(135deg,var(--brand),var(--brand-2))}
.switch[aria-checked="true"]::after{transform:translateX(24px)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.swatch{border:0;border-radius:16px;padding:8px 4px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:800;position:relative}
.swatch .dot{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b))}
.swatch[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--brand)}
.swatch .badge{position:absolute;top:4px;right:4px;padding:2px 4px}

/* sticky start */
.dock{position:sticky;bottom:0;margin:18px calc(-1 * max(16px,env(safe-area-inset-left))) 0;padding:12px max(16px,env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to bottom,transparent,var(--bg) 30%)}

/* play */
.turn{text-align:center;padding:10px 0 4px}
.turn h2{font-size:28px;font-weight:900;margin-top:10px;line-height:1.15;overflow-wrap:anywhere}
.turn .stats{margin-top:6px;color:var(--muted);font-weight:700}
.ask{text-align:center;font-weight:800;color:var(--muted);margin-top:14px;text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.choice{border:0;border-radius:24px;color:#fff;min-height:156px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-weight:900;font-size:22px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}
.choice:active{transform:scale(.96)}
.choice .glyph{font-size:62px;line-height:1;font-weight:900;text-shadow:0 6px 18px rgba(0,0,0,.18)}
.choice.truth{background:linear-gradient(150deg,var(--truth-1),var(--truth-2))}
.choice.dare{background:linear-gradient(150deg,var(--dare-1),var(--dare-2))}
.choice.random{grid-column:1/-1;min-height:64px;flex-direction:row;gap:10px;font-size:19px;background:linear-gradient(120deg,var(--rand-1),var(--rand-2))}
.choice.random.spin{animation:wobble .18s linear infinite}
@keyframes wobble{50%{transform:rotate(-1.2deg) scale(1.02)}}
.next-up{text-align:center;color:var(--muted);font-weight:700;margin-top:6px}

.flip{perspective:1400px;margin:6px 0 14px}
.flip-inner{display:grid;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.9,.25,1.06)}
.flip.revealed .flip-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:28px;min-height:330px}
.face-cover{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;box-shadow:var(--shadow);
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 14px,transparent 14px 28px),linear-gradient(150deg,var(--c1),var(--c2))}
.face-cover .glyph{font-size:120px;font-weight:900;line-height:1}
.face-cover .lbl{font-weight:900;letter-spacing:.2em;text-transform:uppercase}
.face-content{transform:rotateY(180deg);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.card-band{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 18px;color:#fff;background:linear-gradient(120deg,var(--c1),var(--c2))}
.card-band .type{font-weight:900;letter-spacing:.18em;text-transform:uppercase}
.card-band .pk{font-size:13px;font-weight:800;opacity:.92;text-align:right}
.card-text{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px 20px;font-size:clamp(22px,6.4vw,28px);font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.card-for{padding:0 18px 16px;text-align:center;color:var(--muted);font-weight:700;font-size:14px}
.truth-c{--c1:var(--truth-1);--c2:var(--truth-2)}
.dare-c{--c1:var(--dare-1);--c2:var(--dare-2)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .btn{min-height:58px}

.timer{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.ring{width:76px;height:76px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--dare-1);stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:22px;font-variant-numeric:tabular-nums}
.timer.done .ring .fg{stroke:var(--bad)}
.timer.done .num{color:var(--bad)}
.timer-side{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.timer-side .seg button{min-height:38px;min-width:0}

/* summary */
.trophy{width:96px;height:96px;margin:6px auto 8px;border-radius:30px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#f59e0b,#db2777);box-shadow:var(--shadow)}
.trophy .icon{width:54px;height:54px;stroke-width:2}
.win h2{font-size:30px;font-weight:900;text-align:center;line-height:1.15;overflow-wrap:anywhere}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.board li{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow-sm)}
.board .rk{width:26px;text-align:center;font-weight:900;color:var(--muted)}
.board .nm{flex:1;min-width:0;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .nm small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.board .pts{font-weight:900;font-size:20px}
.board li.cur{box-shadow:var(--shadow-sm),inset 0 0 0 2px var(--brand)}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.award{background:var(--surface-2);border-radius:16px;padding:12px}
.award b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--brand-ink)}
.award span{font-weight:800;overflow-wrap:anywhere}

/* premium */
.prem-hero{text-align:center;padding:8px 0 4px}
.crown{width:72px;height:72px;margin:0 auto 10px;border-radius:24px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#f59e0b,var(--brand-2));box-shadow:var(--shadow)}
.crown .icon{width:40px;height:40px}
.prem-hero h2{font-size:28px;font-weight:900}
.perks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.perks li{display:flex;gap:10px;align-items:flex-start;font-weight:700}
.perks .i{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--brand-ink)}
.perks .icon{width:18px;height:18px}
.plans{display:flex;flex-direction:column;gap:10px}
.plan{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow-sm);position:relative}
.plan.best{box-shadow:var(--shadow-sm),inset 0 0 0 3px var(--brand)}
.plan .pi{flex:1;min-width:0}
.plan .pn{font-weight:900;font-size:17px}
.plan .pd{font-size:13px;color:var(--muted);font-weight:600}
.plan .pp{font-size:26px;font-weight:900;white-space:nowrap}

.status b{display:block;font-size:17px}

details.card summary{cursor:pointer;font-weight:900;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:32px}

details.card[open] summary .icon{transform:rotate(180deg)}
.links{display:flex;justify-content:center;gap:18px;margin-top:20px;font-weight:700;font-size:14px}
.links a{min-height:44px;display:inline-flex;align-items:center}
.lbl-sm{display:block;font-size:14px;font-weight:800;margin:10px 0 6px}

/* custom packs */
.cp{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:10px 8px 10px 14px;box-shadow:var(--shadow-sm)}
.cp .nm{flex:1;min-width:0}
.cp .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp .nm span{font-size:13px;color:var(--muted);font-weight:600}
.counter{font-size:13px;font-weight:700;color:var(--muted);text-align:right;margin-top:4px}

/* dialog + toast */
dialog{border:0;padding:0;background:transparent;max-width:min(440px,calc(100vw - 32px));width:100%;color:var(--text)}
dialog::backdrop{background:rgba(10,5,25,.55);backdrop-filter:blur(3px)}
.dlg{background:var(--surface);border-radius:24px;padding:22px 20px 18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);max-height:calc(100dvh - 48px);overflow:auto}
.dlg h2{font-size:22px;font-weight:900;margin-bottom:10px}
.dlg p{color:var(--muted)}
.dlg p+p{margin-top:8px}
.dlg ol{padding-left:22px;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.dlg-actions{display:flex;flex-direction:column-reverse;gap:8px;margin-top:18px}
dialog[open] .dlg{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:60;
  background:#1f1535;color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;max-width:calc(100vw - 32px);width:max-content;text-align:center;box-shadow:0 12px 30px -8px rgba(0,0,0,.5);transition:all .25s}
:root[data-dark="1"] .toast{background:#f6f1ff;color:#1f1535}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{from{transform:translateY(-20px) rotate(var(--r,0deg))}to{transform:translateY(110vh) rotate(calc(var(--r,0deg) + 720deg))}}
.spinner{width:20px;height:20px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

@media (min-width:600px){.choice{min-height:180px}.face{min-height:360px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

<script>
(() => {
'use strict';

/* ============================== CONFIG ============================== */
const APP_NAME = 'DareUp';                               // the game's display name, used everywhere in the UI
const API_BASE_REMOTE = 'https://[your-app].vercel.app'; // hosted API, used from file:// and inside the Android app
const ANDROID_ASSET_HOST = 'appassets.androidplatform.net';
const API_BASE = resolveApiBase();                       // '' means same origin (the hosted website)
const STORE_CHANNEL = detectStoreChannel();              // 'web' | 'direct' | 'play' (set by the Android app)
const SHARE_URL = '';                                    // optional link added to shared results ('' = this site when hosted)
const STORAGE_PREFIX = 'dareup.';                        // keep stable even if APP_NAME changes
const FREE_MAX_PLAYERS = 6;
const PREMIUM_MAX_PLAYERS = 20;
const MIN_PLAYERS = 2;
const RAZORPAY_SRC = 'https://checkout.razorpay.com/v1/checkout.js';
const FALLBACK_PLANS = [ // display copy only; real prices come from the server (api/_lib/plans.js)
  { id: 'monthly', label: 'Monthly pass', price: 49, days: 30 },
  { id: 'yearly', label: 'Yearly pass', price: 199, days: 365 },
  { id: 'lifetime', label: 'Lifetime pass', price: 499, days: null },
];
const VERSION = '1.0.0';

// API base: same origin on the hosted site; the remote API from file:// or the Android app.
// ?api=<url> overrides it for testing. On a public website the override is only honoured for
// localhost, so a crafted link cannot send someone's pass to another server.
function resolveApiBase() {
  const loc = window.location;
  const web = (loc.protocol === 'http:' || loc.protocol === 'https:') && loc.hostname !== ANDROID_ASSET_HOST;
  let override = null;
  try { override = new URLSearchParams(loc.search).get('api'); } catch (e) { override = null; }
  if (override) {
    try {
      const u = new URL(override);
      const loopback = /^(localhost|127\.0\.0\.1|\[::1\]|10\.0\.2\.2)$/.test(u.hostname);
      const devPage = !web || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(loc.hostname);
      if ((u.protocol === 'http:' || u.protocol === 'https:') && (loopback || devPage)) {
        return (u.origin + u.pathname).replace(/\/+$/, '');
      }
    } catch (e) { /* ignore a bad override */ }
  }
  const remote = API_BASE_REMOTE.replace(/\/+$/, '');
  if (!web) return remote;
  // Hosted copies on other sites (itch.io, a mirror) call the configured API; the API's own
  // site, localhost, and an unconfigured placeholder stay same-origin.
  const configured = !/\[your-app\]/.test(remote);
  const local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(loc.hostname);
  let own = false;
  try { own = configured && new URL(remote).origin === loc.origin; } catch (e) { own = false; }
  return configured && !local && !own ? remote : '';
}

function detectStoreChannel() {
  try {
    const b = window.AndroidBridge;
    const v = b && typeof b.storeChannel === 'function' ? String(b.storeChannel()) : 'web';
    return v === 'play' || v === 'direct' ? v : 'web';
  } catch (e) { return 'web'; }
}

// How premium is sold in this build. The Play Store build must not use Razorpay for digital
// goods, so it sells nothing for now. Swap the 'play' branch for Google Play Billing later.
function storeRules() {
  if (STORE_CHANNEL === 'play') {
    return { canBuy: false, canRestore: false, lockedNote: 'Premium packs are coming soon to this version.' };
  }
  return { canBuy: true, canRestore: true, lockedNote: '' };
}

/* ============================== STORAGE ============================== */
const store = {
  get(key, fallback) {
    try { const v = window.localStorage.getItem(STORAGE_PREFIX + key); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
  },
  set(key, value) {
    try { window.localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value)); return true; } catch (e) { return false; }
  },
  del(key) {
    try { window.localStorage.removeItem(STORAGE_PREFIX + key); } catch (e) { /* storage unavailable */ }
  },
};

/* ============================== DATA ============================== */
function readJsonBlock(id, fallback) {
  try { return JSON.parse(document.getElementById(id).textContent); } catch (e) { return fallback; }
}
const FREE_PACKS = readJsonBlock('dareup-free-packs', []);
const PREMIUM_CATALOG = readJsonBlock('dareup-premium-catalog', []);
const CUSTOM_COLOR = '#64748b';
const THEMES = {
  classic: { label: 'Classic', premium: false, a: '#7c3aed', b: '#db2777' },
  neon: { label: 'Neon', premium: true, a: '#a21caf', b: '#06b6d4' },
  mango: { label: 'Mango', premium: true, a: '#f59e0b', b: '#c2410c' },
  ocean: { label: 'Ocean', premium: true, a: '#0369a1', b: '#14b8a6' },
};
const DEFAULT_SETTINGS = { mode: 'auto', theme: 'classic', sound: true, vibrate: true, timer: 60, skipLimit: 3 };
const ROUND_OPTIONS = [3, 5, 10, 0]; // 0 = endless
const LIMITS = { customPacks: 30, cardsPerType: 200, cardLength: 200, packName: 30, playerName: 20 };

const S = {
  settings: loadSettings(),
  players: loadPlayers(),
  setup: loadSetup(),
  game: loadGame(),
  pass: loadPass(),
  premiumPacks: store.get('premiumPacks', null),
  custom: loadCustom(),
  decks: (() => { const d = store.get('decks', {}); return d && typeof d === 'object' ? d : {}; })(),
};

function loadSettings() {
  const s = store.get('settings', {}) || {};
  const o = Object.assign({}, DEFAULT_SETTINGS);
  if (['auto', 'light', 'dark'].includes(s.mode)) o.mode = s.mode;
  if (Object.prototype.hasOwnProperty.call(THEMES, s.theme)) o.theme = s.theme;
  if (typeof s.sound === 'boolean') o.sound = s.sound;
  if (typeof s.vibrate === 'boolean') o.vibrate = s.vibrate;
  if ([0, 30, 60, 90].includes(s.timer)) o.timer = s.timer;
  if ([0, 1, 2, 3, 5, -1].includes(s.skipLimit)) o.skipLimit = s.skipLimit;
  return o;
}
function loadPlayers() {
  const p = store.get('players', []);
  return Array.isArray(p) ? p.filter((n) => typeof n === 'string' && n.trim()).map(cleanName).slice(0, PREMIUM_MAX_PLAYERS) : [];
}
function loadSetup() {
  const s = store.get('setup', {}) || {};
  return {
    packs: Array.isArray(s.packs) ? s.packs.filter((x) => typeof x === 'string').slice(0, 60) : ['classic'],
    rounds: ROUND_OPTIONS.includes(s.rounds) ? s.rounds : 5,
  };
}
function loadGame() {
  const g = store.get('game', null);
  if (!g || !Array.isArray(g.players) || !Array.isArray(g.packs) || typeof g.turn !== 'number') return null;
  return g;
}
function loadPass() {
  const p = store.get('pass', null);
  return p && typeof p.token === 'string' ? p : null;
}
function loadCustom() {
  const c = store.get('custom', []);
  return Array.isArray(c) ? c.filter((p) => p && typeof p.id === 'string' && Array.isArray(p.truths) && Array.isArray(p.dares)) : [];
}
const saveSettings = () => store.set('settings', S.settings);
const savePlayers = () => store.set('players', S.players);
const saveSetup = () => store.set('setup', S.setup);
const saveGame = () => (S.game ? store.set('game', S.game) : store.del('game'));
const saveCustom = () => store.set('custom', S.custom);
const saveDecks = () => store.set('decks', S.decks);

/* ============================== HELPERS ============================== */
const $view = document.getElementById('view');
const $title = document.getElementById('bar-title');
const $back = document.getElementById('bar-back');
const $actions = document.getElementById('bar-actions');
const $toast = document.getElementById('toast');
const $dlg = document.getElementById('dlg');

const ICONS = {
  back: '<path d="M15 18l-6-6 6-6"/>',
  sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  crown: '<path d="M3 18h18l-1.5-10-4.5 4-3-7-3 7-4.5-4z"/>',
  users: '<circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.9 3.1-6 7-6s7 2.1 7 6M16 4.2a4 4 0 010 7.6M22 21c0-3-1.7-5-4.5-5.8"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  x: '<path d="M18 6L6 18M6 6l12 12"/>',

async function doRestore() {
  if (restoreForm.busy) return;
  restoreForm.busy = true;
  restoreForm.msg = '';
  render();
  try {
    const data = await api('/api/restore', { method: 'POST', body: { paymentId: restoreForm.pid.trim(), email: restoreForm.email.trim() } });
    setPass(data);
    await refreshPremiumPacks({ quiet: true });
    restoreForm.ok = true;
    restoreForm.msg = 'Premium restored on this device.';
    restoreForm.pid = '';
    restoreForm.email = '';
    toast('Premium restored.');
  } catch (e) {
    restoreForm.ok = false;
    restoreForm.msg = e.message;
  } finally {
    restoreForm.busy = false;
    if (currentRoute().name === 'premium') render();
  }
}

/* ============================== SETTINGS ============================== */
VIEWS.settings = function () {
  setBar('Settings', []);
  const prem = isPremium();
  const rules = storeRules();
  const sw = (key, label, sub) => {
    const b = h('button', { type: 'button', class: 'switch', role: 'switch', 'aria-checked': String(!!S.settings[key]), 'aria-label': label, 'data-t': 'toggle-' + key,
      onclick: () => { S.settings[key] = !S.settings[key]; saveSettings(); b.setAttribute('aria-checked', String(S.settings[key])); if (key === 'sound' && S.settings.sound) sound('done'); if (key === 'vibrate') buzz(40); } });
    return h('div', { class: 'set-row' }, h('div', null, h('div', { class: 'lbl', text: label }), sub ? h('div', { class: 'sub', text: sub }) : null), b);
  };
  const swatches = h('div', { class: 'swatches', 'data-t': 'themes' }, Object.keys(THEMES).map((id) => {
    const t = THEMES[id];
    const locked = t.premium && !prem;
    return h('button', { type: 'button', class: 'swatch', style: '--a:' + t.a + ';--b:' + t.b, 'aria-pressed': String(effectiveTheme() === id), 'data-t': 'theme-' + id,
      onclick: async () => {
        if (locked) {
          if (!rules.canBuy) { infoBox(t.label + ' theme', rules.lockedNote); return; }
          if (await confirmBox(t.label + ' theme', 'Colour themes come with Premium.', 'See Premium')) go('premium');
          return;
        }
        S.settings.theme = id; saveSettings(); applyTheme(); render();
      } },
    h('span', { class: 'dot' }), h('span', { text: t.label }), locked ? h('span', { class: 'badge lock' }, icon('lock')) : null);
  }));
  mount(h('section', { 'data-t': 'settings' },
    h('div', { class: 'sec-h' }, h('h2', { text: 'Look' })),
    h('div', { class: 'card stack' },
      segmented([{ value: 'auto', label: 'Auto' }, { value: 'light', label: 'Light' }, { value: 'dark', label: 'Dark' }], S.settings.mode, (v) => { S.settings.mode = v; saveSettings(); applyTheme(); }, 'mode'),
      swatches),
    h('div', { class: 'sec' }, h('div', { class: 'sec-h' }, h('h2', { text: 'Game' })),
      h('div', { class: 'card' },
        sw('sound', 'Sound', 'Beeps for cards, timer and wins'),
        sw('vibrate', 'Vibration', 'On phones that support it'),
        h('div', { style: 'padding:10px 0' }, h('div', { class: 'lbl', style: 'font-weight:800;margin-bottom:8px', text: 'Dare timer' }),
          segmented([0, 30, 60, 90].map((n) => ({ value: n, label: n ? n + 's' : 'Off' })), S.settings.timer, (v) => { S.settings.timer = v; saveSettings(); }, 'timer-default')),
        h('div', { style: 'padding:10px 0' }, h('div', { class: 'lbl', style: 'font-weight:800;margin-bottom:2px', text: 'Skips per player' }),
          h('div', { class: 'sub muted', style: 'font-size:13px;margin-bottom:8px', text: 'How many times each player can chicken out in a game' }),
          segmented([0, 1, 2, 3, 5, -1].map((n) => ({ value: n, label: n < 0 ? '∞' : String(n), aria: n < 0 ? 'Unlimited' : String(n) })), S.settings.skipLimit, (v) => { S.settings.skipLimit = v; saveSettings(); }, 'skips')))),
    h('div', { class: 'sec' }, h('div', { class: 'sec-h' }, h('h2', { text: 'Your data' })),
      h('div', { class: 'card stack' },
        h('p', { class: 'muted', style: 'font-size:14px', text: 'Players, scores, settings and your own packs are saved only on this device.' }),
        h('button', { type: 'button', class: 'btn btn-block', 'data-t': 'reset-decks', onclick: () => { S.decks = {}; saveDecks(); toast('Card history cleared. All cards can come up again.'); } }, icon('refresh'), 'Reset card history'),
        h('button', { type: 'button', class: 'btn btn-block btn-danger', 'data-t': 'wipe', onclick: wipeAll }, icon('trash'), 'Delete all data on this device'))),
    h('p', { class: 'fine', text: APP_NAME + ' ' + VERSION + (STORE_CHANNEL !== 'web' ? ' · ' + STORE_CHANNEL : '') }),
    legalLinks()));
};
async function wipeAll() {
  const restorable = storeRules().canRestore;
  const ok = await confirmBox('Delete everything?', 'This removes players, games, settings, your own packs and any premium pass from this device.' + (restorable ? ' A paid pass can be restored later with your payment ID and email.' : ''), 'Delete all', true);
  if (!ok) return;
  ['settings', 'players', 'setup', 'game', 'pass', 'premiumPacks', 'custom', 'decks', 'pending'].forEach((k) => store.del(k));
  S.settings = Object.assign({}, DEFAULT_SETTINGS);
  S.players = [];
  S.setup = { packs: ['classic'], rounds: 5 };
  S.game = null;
  S.pass = null;
  S.premiumPacks = null;
  S.custom = [];
  S.decks = {};
  applyTheme();
  toast('All data deleted.');
  go('home', null, { replace: true });
}

/* ============================== CUSTOM PACKS ============================== */
VIEWS.packs = function () {
  setBar('My packs', []);
  const prem = isPremium();
  const rules = storeRules();
  const rows = S.custom.map((p) => h('div', { class: 'cp', 'data-t': 'custom-row' },
    h('span', { class: 'nm' }, h('b', { text: p.name }), h('span', { text: plural(p.truths.length, 'truth') + ' · ' + plural(p.dares.length, 'dare') })),
    prem ? iconBtn('edit', 'Edit ' + p.name, () => go('edit', p.id), 'custom-edit') : null,
    iconBtn('trash', 'Delete ' + p.name, () => deleteCustom(p), 'custom-delete')));
  mount(h('section', { 'data-t': 'packs-screen' },
    prem
      ? h('div', { class: 'stack' },
        h('p', { class: 'muted', text: 'Write your own truths and dares. Perfect for inside jokes, birthdays and team nights.' }),
        h('button', { type: 'button', class: 'btn btn-primary btn-block', 'data-t': 'new-pack', disabled: S.custom.length >= LIMITS.customPacks, onclick: () => go('edit', 'new') }, icon('plus'), 'New pack'))
      : h('div', { class: 'card', style: 'text-align:center' },
        h('div', { class: 'crown' }, icon('lock')),
        h('h2', { style: 'font-size:22px;font-weight:900', text: 'Make your own packs' }),
        h('p', { class: 'muted', style: 'margin:6px 0 14px', text: 'Write your own truths and dares, saved on your device.' }),
        rules.canBuy
          ? h('button', { type: 'button', class: 'btn btn-primary btn-block', 'data-t': 'packs-premium', onclick: () => go('premium') }, icon('crown'), 'Get Premium')
          : h('p', { class: 'note info', 'data-t': 'locked-note' }, icon('info'), h('span', { text: rules.lockedNote }))),
    rows.length ? h('div', { class: 'sec stack' }, rows) : prem ? h('p', { class: 'fine', text: 'No packs yet.' }) : null));
};
async function deleteCustom(p) {
  if (!(await confirmBox('Delete "' + p.name + '"?', 'This pack and its cards will be removed from this device.', 'Delete', true))) return;
  S.custom = S.custom.filter((x) => x.id !== p.id);
  S.setup.packs = S.setup.packs.filter((x) => x !== p.id);
  delete S.decks[p.id + ':truth'];
  delete S.decks[p.id + ':dare'];
  saveCustom(); saveSetup(); saveDecks();
  render();
}
function parseLines(text) {
  const seen = new Set();
  return String(text || '').split(/\r?\n/).map((l) => l.replace(/[\u0000-\u001f\u007f]/g, '').trim()).filter((l) => {
    if (!l || seen.has(l.toLowerCase())) return false;
    seen.add(l.toLowerCase());
    return true;
  }).map((l) => l.slice(0, LIMITS.cardLength)).slice(0, LIMITS.cardsPerType);
}
VIEWS.edit = function (id) {
  if (!isPremium()) { go('packs', null, { replace: true }); return; }
  const existing = id && id !== 'new' ? S.custom.find((p) => p.id === id) : null;
  if (id !== 'new' && !existing) { go('packs', null, { replace: true }); return; }
  setBar(existing ? 'Edit pack' : 'New pack', []);
  const name = h('input', { class: 'input', type: 'text', maxlength: String(LIMITS.packName), placeholder: 'Pack name, e.g. [Birthday special]', value: existing ? existing.name : '', 'aria-label': 'Pack name', 'data-t': 'pack-name' });
  const truths = h('textarea', { class: 'input', placeholder: 'One truth per line', 'aria-label': 'Truths, one per line', 'data-t': 'pack-truths' });
  const dares = h('textarea', { class: 'input', placeholder: 'One dare per line', 'aria-label': 'Dares, one per line', 'data-t': 'pack-dares' });
  truths.value = existing ? existing.truths.join('\n') : '';
  dares.value = existing ? existing.dares.join('\n') : '';
  const tCount = h('p', { class: 'counter' });
  const dCount = h('p', { class: 'counter' });
  const err = h('p', { class: 'field-err', role: 'alert' });
  const count = () => {
    tCount.textContent = plural(parseLines(truths.value).length, 'truth') + ' (max ' + LIMITS.cardsPerType + ')';
    dCount.textContent = plural(parseLines(dares.value).length, 'dare') + ' (max ' + LIMITS.cardsPerType + ')';
  };
  truths.addEventListener('input', count);
  dares.addEventListener('input', count);
  count();
  function save() {
    const n = cleanName(name.value).slice(0, LIMITS.packName);
    const t = parseLines(truths.value);
    const d = parseLines(dares.value);
    if (!n) { err.textContent = 'Give your pack a name.'; name.focus(); return; }
    if (!t.length && !d.length) { err.textContent = 'Add at least one truth or dare.'; return; }
    if (existing) { existing.name = n; existing.truths = t; existing.dares = d; existing.updatedAt = Date.now(); }
    else {
      const p = { id: 'c_' + randId(10), name: n, truths: t, dares: d, createdAt: Date.now() };
      S.custom.push(p);
      if (!S.setup.packs.includes(p.id)) { S.setup.packs.push(p.id); saveSetup(); }
    }
    if (!saveCustom()) { err.textContent = 'Could not save on this device (storage is full or blocked).'; return; }
    toast('Pack saved.');
    go('packs', null, { replace: true });
  }
  mount(h('section', { 'data-t': 'edit-screen' },
    h('div', { class: 'stack' },
      h('label', { class: 'lbl-sm', text: 'Name' }), name,
      h('label', { class: 'lbl-sm', text: 'Truths' }), truths, tCount,
      h('label', { class: 'lbl-sm', text: 'Dares' }), dares, dCount,
      h('p', { class: 'note info' }, icon('info'), h('span', { text: 'Tip: write {other} and the game swaps in another player\'s name. Keep it kind and safe.' })),
      err,
      h('div', { class: 'grid2' },
        h('button', { type: 'button', class: 'btn', onclick: () => goBack() }, 'Cancel'),
        h('button', { type: 'button', class: 'btn btn-primary', 'data-t': 'pack-save', onclick: save }, icon('check'), 'Save')))));
};

/* ============================== PWA + STARTUP ============================== */
// Manifest and service worker only on the hosted website: never on file:// or in the Android app.
function setupPwa() {
  const loc = window.location;
  const hosted = (loc.protocol === 'https:' || loc.protocol === 'http:') && loc.hostname !== ANDROID_ASSET_HOST;
  if (!hosted) return;
  document.head.append(h('link', { rel: 'manifest', href: 'manifest.webmanifest' }), h('link', { rel: 'apple-touch-icon', href: 'icons/icon-192.png' }));
  if ('serviceWorker' in navigator && window.isSecureContext) {
    const reg = () => navigator.serviceWorker.register('sw.js').catch(() => { /* offline shell is optional */ });
    if (document.readyState === 'complete') reg(); else window.addEventListener('load', reg);
  }
}
function setFavicon() {
  const link = document.querySelector('link[rel="icon"]');
  if (link) link.href = 'data:image/svg+xml,' + encodeURIComponent(LOGO_SVG);
}

document.title = APP_NAME + ' · Truth or Dare';
checkExpiry();
applyTheme();
setFavicon();
setupPwa();
render();
if (isPremium() && apiReady() && navigator.onLine !== false && (!S.premiumPacks || Date.now() - (S.premiumPacks.fetchedAt || 0) > 3 * 864e5)) {
  refreshPremiumPacks({ quiet: true }).then((ok) => { if (ok && ['setup', 'premium'].includes(currentRoute().name)) render(); });
}
if (storeRules().canBuy) retryPending(true);
setInterval(() => { // a pass can end while the app is open
  if (S.pass && !passActive() && S.premiumPacks) { checkExpiry(); applyTheme(); }
}, 60000);
})();
</script>
