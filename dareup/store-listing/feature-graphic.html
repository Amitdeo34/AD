<!doctype html>
<html><head><meta charset="utf-8"><title>Feature graphic</title>
<style>
  html,body{margin:0}
  .fg{width:1024px;height:500px;position:relative;overflow:hidden;
    background:radial-gradient(120% 140% at 25% 30%,#3B1F78 0%,#1A1033 62%);
    font-family:"Inter Display","Inter",system-ui,sans-serif;color:#fff}
  .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.6px);background-size:26px 26px}
  .art{position:absolute;left:70px;top:50px;width:400px;height:400px}
  .copy{position:absolute;left:500px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;padding-right:40px}
  h1{margin:0;font-size:104px;line-height:1;font-weight:900;letter-spacing:-3px}
  h1 span{color:#FFD23F}
  p{margin:18px 0 0;font-size:36px;font-weight:600;line-height:1.2;color:#FFD9E6}
  .chips{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
  .chip{font-size:22px;font-weight:700;padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.22)}
</style></head>
<body>
<div class="fg" id="fg">
  <div class="dots"></div>
  <svg class="art" viewBox="18 18 72 72" xmlns="http://www.w3.org/2000/svg">
    <g transform="rotate(-13 44 56)">
      <rect x="26" y="33" width="31" height="44" rx="6" fill="#FF3D7F"/>
      <path d="M35.3 47.5a5.7 5.7 0 1 1 8.4 5c-1.7 1-2.7 2-2.7 4.2" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="41" cy="64" r="2.6" fill="#fff"/>
    </g>
    <g transform="rotate(11 64 54)">
      <rect x="48" y="31" width="31" height="44" rx="6" fill="#FFD23F"/>
      <rect x="61.4" y="40" width="4.6" height="17.5" rx="2.3" fill="#1A1033"/>
      <circle cx="63.7" cy="64" r="2.8" fill="#1A1033"/>
    </g>
  </svg>
  <div class="copy">
    <h1>Dare<span>Up</span></h1>
    <p>Truth or Dare for every party</p>
    <div class="chips"><span class="chip">Friends</span><span class="chip">Family</span><span class="chip">Plays offline</span></div>
  </div>
</div>
</body></html>
