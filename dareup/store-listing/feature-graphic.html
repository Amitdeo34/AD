<!doctype html>
<html><head><meta charset="utf-8"><title>Feature graphic</title>
<style>
  html,body{margin:0}
  .fg{width:1024px;height:500px;position:relative;overflow:hidden;
    background:linear-gradient(120deg,#7C3AED 0%,#DB2777 58%,#F97316 100%);
    font-family:"Inter Display","Inter",system-ui,sans-serif;color:#fff}
  .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.6px);background-size:26px 26px}
  .art{position:absolute;left:60px;top:50px;width:400px;height:400px;filter:drop-shadow(0 18px 30px rgba(60,10,60,.35))}
  .copy{position:absolute;left:500px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;padding-right:40px}
  h1{margin:0;font-size:104px;line-height:1;font-weight:900;letter-spacing:-3px}
  h1 span{color:#FDE047}
  p{margin:18px 0 0;font-size:36px;font-weight:600;line-height:1.2;color:#FFF1F7}
  .chips{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
  .chip{font-size:22px;font-weight:700;padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.35)}
</style></head>
<body>
<div class="fg" id="fg">
  <div class="dots"></div>
  <svg class="art" viewBox="60 60 392 392" xmlns="http://www.w3.org/2000/svg">
    <g transform="rotate(-14 186 243)">
      <rect x="96" y="118" width="180" height="250" rx="30" fill="#FFFFFF"/>
      <path d="M136 205A34 34 0 1 1 196 227C178 239 170 245 170 264" fill="none" stroke="#4F46E5" stroke-width="25" stroke-linecap="round"/>
      <circle cx="170" cy="305" r="15" fill="#4F46E5"/>
    </g>
    <g transform="rotate(12 326 265)">
      <rect x="236" y="140" width="180" height="250" rx="30" fill="#FDE047"/>
      <rect x="313" y="182" width="26" height="114" rx="13" fill="#E11D48"/>
      <circle cx="326" cy="334" r="16" fill="#E11D48"/>
    </g>
  </svg>
  <div class="copy">
    <h1>Dare<span>Up</span></h1>
    <p>Truth or Dare for every party</p>
    <div class="chips"><span class="chip">Friends</span><span class="chip">Family</span><span class="chip">Plays offline</span></div>
  </div>
</div>
</body></html>
