<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DPR Consolidator — JSW Utkal Steel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --navy:#1f3864; --blue:#2e5395; --blue2:#4472c4; --red:#c00000;
  --ink:#16202f; --muted:#5b6880; --line:#d9dfea; --bg:#f4f6fa; --card:#fff;
  --ok:#1f7a4d; --okbg:#e6f4ec; --warn:#8a5a00; --warnbg:#fff4dc;
  --err:#9c0006; --errbg:#fde8ea; --key:#e2efda; --calc:#e8edf7; --input:#fff7e0;
  --radius:10px; --shadow:0 1px 2px rgba(16,32,64,.06),0 8px 24px rgba(16,32,64,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 "Segoe UI",Roboto,-apple-system,Helvetica,Arial,sans-serif}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
button{font:inherit}
a{color:var(--blue)}

/* ---------- shell ---------- */
header.top{background:linear-gradient(97deg,var(--navy),#2b4a86);color:#fff;
  padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(16,32,64,.18)}
.logo{font-weight:800;font-size:19px;letter-spacing:.5px;
  background:var(--red);padding:4px 10px;border-radius:6px}
header.top h1{font-size:16px}
header.top .sub{font-size:12px;opacity:.78;margin-top:1px}
.spacer{flex:1}
.hbtn{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.3);
  color:#fff;padding:7px 13px;border-radius:7px;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.24)}

nav.steps{display:flex;gap:4px;background:var(--card);padding:0 14px;
  border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:58px;z-index:40}
nav.steps button{background:none;border:0;border-bottom:3px solid transparent;
  padding:13px 15px;cursor:pointer;color:var(--muted);white-space:nowrap;font-weight:550}
nav.steps button .n{display:inline-grid;place-items:center;width:20px;height:20px;
  border-radius:50%;background:var(--line);color:var(--muted);font-size:11px;
  margin-right:7px;font-weight:700;vertical-align:1px}
nav.steps button.on{color:var(--navy);border-bottom-color:var(--red)}
nav.steps button.on .n{background:var(--red);color:#fff}
nav.steps button.done .n{background:var(--ok);color:#fff}

main{max-width:1560px;margin:0 auto;padding:20px 20px 80px}
section.pane{display:none} section.pane.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card>h2{font-size:15px;color:var(--navy);margin-bottom:3px}
.card>h2+p.hint{margin:0 0 14px;color:var(--muted);font-size:12.5px}
p.hint{color:var(--muted);font-size:12.5px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
input[type=text],input[type=date],input[type=number],select,textarea{
  border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid #b9cdf0;outline-offset:-1px;border-color:var(--blue2)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:7px;padding:8px 15px;
  cursor:pointer;font-weight:600}
.btn:hover{background:var(--navy)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.sec:hover{background:#eef2f9}
.btn.red{background:var(--red)} .btn.red:hover{background:#8f0000}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}

/* ---------- drop zone ---------- */
.drop{border:2px dashed #b9c6dd;border-radius:var(--radius);background:#fbfcfe;
  padding:34px;text-align:center;cursor:pointer;transition:.15s}
.drop:hover,.drop.hot{border-color:var(--blue2);background:#eff4fc}
.drop .big{font-size:15px;font-weight:650;color:var(--navy)}

/* ---------- tables ---------- */
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:62vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);
  text-align:left;white-space:nowrap}
th{background:var(--blue);color:#fff;position:sticky;top:0;z-index:2;font-weight:600;
  text-align:center;font-size:11.5px;line-height:1.25}
thead tr.codes th{background:var(--blue2);font-style:italic;font-weight:400;top:31px;font-size:10.5px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.area td{background:var(--navy);color:#fff;font-weight:700;letter-spacing:.03em}
tr.act td{background:#dbe5f5;font-weight:700;color:var(--navy)}
tr.sub td{background:#eef2f9;font-weight:700;border-top:2px solid var(--blue2)}
tr.grand td{background:var(--navy);color:#fff;font-weight:800}
tbody tr:hover td:not([class*=area]):not([class*=act]){background:#f7f9fd}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:650}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.err{background:var(--errbg);color:var(--err)} .pill.info{background:#e7eefb;color:var(--blue)}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 15px;box-shadow:var(--shadow)}
.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.kpi .val{font-size:23px;font-weight:700;color:var(--navy);margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:12px;color:var(--muted);font-weight:500}

/* ---------- file cards / mapping ---------- */
.fcard{border:1px solid var(--line);border-radius:9px;margin-bottom:12px;overflow:hidden}
.fhead{display:flex;gap:11px;align-items:center;padding:11px 13px;background:#f7f9fd;
  cursor:pointer;border-bottom:1px solid var(--line)}
.fhead .nm{font-weight:650}
.fbody{padding:13px;display:none} .fcard.open .fbody{display:block}
.maprow{display:grid;grid-template-columns:220px 1fr 78px;gap:9px;align-items:center;
  padding:5px 0;border-bottom:1px dotted var(--line)}
.maprow .lab{font-size:12.5px;font-weight:600}
.maprow .lab small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.maprow select{width:100%}
.conf{font-size:11px;text-align:center}
.prevw{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:7px;margin-top:9px}
.prevw table th{background:#5b6880;font-size:10.5px}
.prevw td{font-size:11.5px;color:var(--muted)}

.banner{padding:10px 13px;border-radius:8px;font-size:13px;margin-bottom:12px;border:1px solid}
.banner.ok{background:var(--okbg);border-color:#b7ddc8;color:#14603b}
.banner.warn{background:var(--warnbg);border-color:#eccf90;color:var(--warn)}
.banner.err{background:var(--errbg);border-color:#f0bcc2;color:var(--err)}
.banner.info{background:#eef3fc;border-color:#c3d4f0;color:var(--navy)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:9px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.12)}
code.k{background:#eef2f9;padding:1px 5px;border-radius:4px;font-size:12px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1100px){.split{grid-template-columns:1fr}}
.muted{color:var(--muted)}
.toast{position:fixed;right:18px;bottom:18px;background:var(--navy);color:#fff;padding:11px 16px;
  border-radius:9px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:200;opacity:0;transform:translateY(10px);
  transition:.22s;pointer-events:none;max-width:380px}
.toast.on{opacity:1;transform:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
details.dd{border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-top:10px;background:#fbfcfe}
details.dd summary{cursor:pointer;font-weight:600;color:var(--navy);font-size:13px}
ol.steps2{margin:8px 0 0 18px;padding:0} ol.steps2 li{margin:5px 0}
</style>
</head>
<body>
<header class="top">
  <span class="logo">JSW</span>
  <div>
    <h1>DPR Consolidator</h1>
    <div class="sub">Vendor DPRs (any format) &rarr; one approved-format Daily Progress Report</div>
  </div>
  <div class="spacer"></div>
  <button class="hbtn" id="btnSave">Save session</button>
  <button class="hbtn" id="btnLoad">Open session</button>
  <button class="hbtn" id="btnReset">Reset</button>
</header>

<nav class="steps" id="nav"></nav>

<main>
  <section class="pane" data-p="0" id="p0"></section>
  <section class="pane" data-p="1" id="p1"></section>
  <section class="pane" data-p="2" id="p2"></section>
  <section class="pane" data-p="3" id="p3"></section>
  <section class="pane" data-p="4" id="p4"></section>
</main>
<div class="toast" id="toast"></div>
<input type="file" id="hiddenFile" style="display:none" multiple>
<script>
/* =====================================================================
   DPR CONSOLIDATOR  —  core engine
   Mirrors dpr/schema.py.  Keep the two in step if you change a column.
   ===================================================================== */

const FIELDS = [
  {k:'sl',          c:'a', h:'SL.',                            w:5,  t:'num'},
  {k:'structure',   c:'b', h:'Name of the Structures',         w:38, t:'text'},
  {k:'area',        c:'c', h:'Area',                           w:22, t:'text'},
  {k:'activity',    c:'d', h:'Activity',                       w:24, t:'text'},
  {k:'agency',      c:'e', h:'Agency / Contractor',            w:22, t:'text'},
  {k:'scope',       c:'f', h:'Scope',                          w:11, t:'num'},
  {k:'drawing',     c:'g', h:'Drawing Released',               w:12, t:'num'},
  {k:'front',       c:'h', h:'Cum Front Available',            w:12, t:'num'},
  {k:'last_month',  c:'i', h:'Achieved till last month',       w:13, t:'num'},
  {k:'plan_ftm',    c:'j', h:'Plan FTM',                       w:11, t:'num'},
  {k:'plan_ftd',    c:'k', h:'Plan FTD',                       w:11, t:'num'},
  {k:'ach_ftd',     c:'l', h:'Achieved FTD',                   w:11, t:'num'},
  {k:'ach_ftm_prev',c:'m', h:'Achieved FTM till previous date',w:13, t:'num'},
  {k:'variance',    c:'n', h:'Variance for the Day',           w:12, t:'calc'},
  {k:'reason',      c:'o', h:'Reason(s) for Variance',         w:26, t:'text'},
  {k:'ach_ftm',     c:'p', h:'Achieved FTM till date',         w:13, t:'calc'},
  {k:'workdone',    c:'q', h:'Workdone Till Date',             w:13, t:'calc'},
  {k:'pct',         c:'r', h:'% Complete',                     w:10, t:'pct'},
  {k:'balance',     c:'s', h:'Balance',                        w:11, t:'calc'},
  {k:'remarks',     c:'t', h:'Remarks',                        w:30, t:'text'},
  {k:'manpower',    c:'u', h:'Available Manpower',             w:11, t:'num'}
];
const CODES = {variance:'n = k-l', ach_ftm:'p = l+m', workdone:'q = i+p',
               pct:'r = (q/f)x100', balance:'s = f-q'};
/* fields a vendor file can supply (calculated ones are never imported) */
const IMPORTABLE = FIELDS.filter(f=>f.t!=='calc'&&f.t!=='pct'&&f.k!=='sl').map(f=>f.k);

const SUMF = [
  {k:'sl',       c:'a', h:'SI No.',              w:7,  t:'text'},
  {k:'activity', c:'b', h:'Area / Activities',   w:42, t:'text'},
  {k:'agency',   c:'c', h:'Agency / Contractor', w:24, t:'text'},
  {k:'scope',    c:'d', h:'Scope',               w:12, t:'num'},
  {k:'drawing',  c:'e', h:'Drawing Released',    w:12, t:'num'},
  {k:'front',    c:'f', h:'Front Available',     w:12, t:'num'},
  {k:'workdone', c:'g', h:'Workdone Till Date',  w:12, t:'num'},
  {k:'pct',      c:'h', h:'% Complete',          w:11, t:'pct'},
  {k:'balance',  c:'i', h:'Balance',             w:12, t:'num'},
  {k:'plan_ftm', c:'j', h:'Plan for {MON}',      w:12, t:'num'},
  {k:'ach_ftm',  c:'k', h:'Achieved for {MON}',  w:12, t:'num'},
  {k:'ach_ftd',  c:'l', h:'Achieved FTD',        w:12, t:'num'},
  {k:'manpower', c:'m', h:'Available Manpower',  w:12, t:'num'}
];
const SUMCODES = {pct:'h = (g/d)x100', balance:'i = d-g'};

const DISCIPLINES = [
  {sheet:'Piling',           act:'Piling Works (Nos)',      uom:'Nos'},
  {sheet:'Civil',            act:'Civil Works (Cum)',       uom:'Cum'},
  {sheet:'Structural',       act:'Structural Supply (MT)',  uom:'MT',
     alt:['Structural Supply (MT)','Structural Erection (MT)']},
  {sheet:'Equipment',        act:'Equipment Erection (MT)', uom:'MT',
     alt:['Equipment Supply (MT)','Equipment Erection (MT)']},
  {sheet:'Piping',           act:'Piping (Inch-Mtr)',       uom:'Inch-Mtr'},
  {sheet:'Cable Trays (Km)', act:'Cable Trays (Km)',        uom:'Km'},
  {sheet:'Cabling (Km)',     act:'Cabling (Km)',            uom:'Km'},
  {sheet:'Panels (Nos)',     act:'Panels (Nos)',            uom:'Nos'}
];
const SHEET_NAMES = DISCIPLINES.map(d=>d.sheet);
const ACTIVITIES = DISCIPLINES.flatMap(d=>d.alt||[d.act]);

/* header synonyms — same list as the Mapping sheet of the workbook */
const SYN = {
  structure:   ['name of the structures','name of structure','structure','description','activity description',
                'description of work','item','item description','work description','particulars','building',
                'location','element','activity name','name','sub activity','works'],
  area:        ['area','zone','unit','block','package','plant area','section','area/activities','area / activities','facility'],
  activity:    ['activity','discipline','work type','sub head','subhead','category of work','type of work','trade'],
  agency:      ['agency','contractor','vendor','sub contractor','subcontractor','agency/contractor',
                'agency / contractor','executing agency','party','firm','agency name'],
  scope:       ['scope','total scope','total qty','total quantity','boq qty','boq quantity','contract qty',
                'ordered qty','order qty','po qty','scope qty','total scope qty','tender qty','qty total mt',
                'total mt','qty','quantity','total nos','total cum'],
  drawing:     ['drawing released','drawings released','drg released','drawing issued','drawings issued',
                'gfc released','ifc released','gfc','drawing release','drg release','approved drawing',
                'drawings','drawing'],
  front:       ['front available','cum front available','cumulative front available','front','fronts released',
                'work front','front released','front availability','front cleared'],
  last_month:  ['achieved till last month','cum till last month','upto last month','up to last month',
                'progress till last month','opening balance','cum upto last month','till last month',
                'achieved upto last month','previous month cumulative'],
  plan_ftm:    ['plan ftm','plan for the month','monthly plan','mtd plan','target for month','plan month',
                'month plan','planned for month','plan for month','monthly target'],
  plan_ftd:    ['plan ftd','plan for the day','daily plan','today plan','plan today','planned today',
                'day plan','target for the day','daily target'],
  ach_ftd:     ['achieved ftd','actual ftd','today achievement','progress today','daily progress','done today',
                'qty today','achievement for the day','achieved for the day','today','actual for the day',
                'day progress','achieved today','ftd','actual day','actual today','actual for day',
                'achievement','progress for the day','qty achieved','executed today','done for the day'],
  ach_ftm_prev:['achieved ftm till previous date','mtd till previous day','month till yesterday',
                'cum month previous','achieved ftm till prev date','mtd previous','month to date previous',
                'actual month till prev','month till previous','achieved month till previous'],
  reason:      ['reason','reason for variance','reasons for variance','reason(s) for variance','remarks for variance',
                'constraint','constraints','hold reason','delay reason','issue'],
  remarks:     ['remarks','remark','comment','comments','notes','observation','status'],
  manpower:    ['manpower','available manpower','labour','labor','workmen','man power','manpower deployed',
                'strength','total manpower','manpower nos'],
  uom:         ['uom','unit','units','unit of measure','measurement']
};

/* ---------------------------------------------------------------- utils */
const $  = (s,r)=>(r||document).querySelector(s);
const $$ = (s,r)=>[...(r||document).querySelectorAll(s)];
const esc= s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s==null?'':s).toLowerCase()
              .replace(/[‘’“”]/g,"'").replace(/[^a-z0-9]+/g,' ').trim();
/* aggressive key: drops legal suffixes, spaces, punctuation */
const key = s=>norm(s).replace(/\b(m s|ms|messrs|pvt|private|ltd|limited|llp|inc|co|company|corp|corporation|constructions?|construction|enterprises?|infra|infrastructures?|projects?|engineers?|engineering|india|and|the)\b/g,'')
              .replace(/\s+/g,'');
const numf=(v,d)=>{ if(v==null||v==='')return d===undefined?null:d;
  if(typeof v==='number')return isFinite(v)?v:(d===undefined?null:d);
  let s=String(v).replace(/[,  ]/g,'').replace(/^\((.*)\)$/,'-$1').replace(/[^0-9.eE+-]/g,'');
  if(s===''||s==='-')return d===undefined?null:d;
  const n=parseFloat(s); return isFinite(n)?n:(d===undefined?null:d); };
const n0=v=>numf(v,0)||0;
const fmt=(v,dec)=>{ if(v==null||v==='')return '-';
  const n=Number(v); if(!isFinite(n))return '-';
  if(Math.abs(n)<1e-9)return '-';
  return n.toLocaleString('en-IN',{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0}); };
const pctf=v=>(v==null||!isFinite(v))?'-':Math.round(v*100)+'%';
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),ms||2600);}
const MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monLabel(d){ if(!d)return ''; const dt=new Date(d); if(isNaN(dt))return '';
  return MON3[dt.getMonth()]+'-'+String(dt.getFullYear()).slice(2); }

/* similarity: token Jaccard + substring bonus, 0..1 */
const stem=t=>(t.length>3&&/s$/.test(t)&&!/ss$/.test(t))?t.slice(0,-1):t;
function sim(a,b){
  a=norm(a); b=norm(b); if(!a||!b)return 0; if(a===b)return 1;
  const A=new Set(a.split(' ').map(stem)), B=new Set(b.split(' ').map(stem));
  let inter=0; A.forEach(t=>{if(B.has(t))inter++;});
  let j=inter/(A.size+B.size-inter);
  if(a.includes(b)||b.includes(a)) j=Math.max(j,.82);
  const ka=key(a), kb=key(b);
  if(ka&&kb&&ka===kb) j=Math.max(j,.95);
  return j;
}

/* ---------------------------------------------------------------- state */
const ST = {
  cfg:{project:'Phase-1 Greenfield Expansion Projects, JSW Utkal Steel Limited',
       report:'Daily Progress Report', dataDate:'', repDate:'', prepared:'', reviewed:''},
  master:[],        // {structure,area,activity,agency,scope,sheet,uom}
  files:[],         // {id,name,sheets:[{name,aoa,use,hdr,map,disc,area,activity,agency,rows}]}
  aliases:{area:{},activity:{},agency:{},structure:{}},
  manual:{},        // vendorKey -> master index
  rows:[],          // consolidated canonical rows
  unmatched:[]
};
const LSKEY='jsw_dpr_consolidator_v1';
function persist(){ try{ localStorage.setItem(LSKEY, JSON.stringify(
    {cfg:ST.cfg, master:ST.master, aliases:ST.aliases, manual:ST.manual, profiles:ST.profiles||{}}));}catch(e){} }
function restore(){ try{ const o=JSON.parse(localStorage.getItem(LSKEY)||'{}');
    if(o.cfg) Object.assign(ST.cfg,o.cfg);
    if(o.master) ST.master=o.master;
    if(o.aliases) ST.aliases=Object.assign({area:{},activity:{},agency:{},structure:{}},o.aliases);
    if(o.manual) ST.manual=o.manual;
    ST.profiles=o.profiles||{};
  }catch(e){ ST.profiles={}; } }
function alias(type,v){ const k=key(v); return (ST.aliases[type]&&ST.aliases[type][k])||v; }

/* ---------------------------------------------------------------- parsing */
function readWorkbook(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej(new Error('cannot read '+file.name));
    r.onload=e=>{
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true,cellStyles:false});
        const sheets=wb.SheetNames.map(n=>({
          name:n,
          aoa:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null,blankrows:false})
        })).filter(s=>s.aoa.length);
        res(sheets);
      }catch(err){ rej(err); }
    };
    r.readAsArrayBuffer(file);
  });
}

/* find the header row: the row whose cells best match known column wordings */
function detectHeader(aoa){
  let best={row:0,score:-1};
  const lim=Math.min(aoa.length,25);
  for(let i=0;i<lim;i++){
    const cells=(aoa[i]||[]).map(c=>norm(c)).filter(Boolean);
    if(cells.length<3) continue;
    let score=0, hits=0;
    cells.forEach(c=>{
      let bs=0;
      for(const k in SYN) SYN[k].forEach(s=>{ const v=sim(c,s); if(v>bs) bs=v; });
      if(bs>.6) hits++;
      score+=bs;
    });
    /* prefer rows with many textual headers and few numbers below-ish */
    const numish=(aoa[i]||[]).filter(c=>typeof c==='number').length;
    score = score + hits*1.4 - numish*1.2;
    if(score>best.score) best={row:i,score:score};
  }
  return best.row;
}

/* merge a 2-row header (common in vendor files) */
function headerLabels(aoa,hdr){
  const a=aoa[hdr]||[], b=(hdr+1<aoa.length)?aoa[hdr+1]:[];
  const width=Math.max(a.length,b.length);
  const bIsSub = b.length && b.filter(c=>typeof c==='string'&&norm(c)).length>=Math.max(2,Math.floor(width*0.3))
                 && b.filter(c=>typeof c==='number').length===0;
  const out=[]; let carry='';
  for(let i=0;i<width;i++){
    let top=a[i]==null?'':String(a[i]).trim();
    if(top) carry=top; else if(!top&&carry&&bIsSub) top=carry;
    const sub=bIsSub&&b[i]!=null?String(b[i]).trim():'';
    out.push([top,sub].filter(Boolean).join(' ').trim());
  }
  return {labels:out, consumed:bIsSub?2:1};
}

/* map vendor headers -> canonical fields */
function autoMap(labels){
  const scores=[];
  labels.forEach((lab,i)=>{
    const nl=norm(lab); if(!nl) return;
    for(const f in SYN){
      let b=0; SYN[f].forEach(s=>{const v=sim(nl,s); if(v>b)b=v;});
      if(b>.5) scores.push({f:f,i:i,s:b});
    }
  });
  scores.sort((x,y)=>y.s-x.s);
  const map={}, usedCol=new Set(), usedF=new Set();
  scores.forEach(o=>{
    if(usedF.has(o.f)||usedCol.has(o.i)) return;
    if(!IMPORTABLE.includes(o.f)&&o.f!=='uom') return;
    map[o.f]={col:o.i, conf:o.s};
    usedF.add(o.f); usedCol.add(o.i);
  });
  /* second pass: for the columns a DPR cannot do without, accept a weaker
     match rather than silently dropping the vendor's number. Flagged low
     confidence so the reviewer is told to look. */
  ['structure','ach_ftd','scope','last_month','plan_ftd','plan_ftm','ach_ftm_prev']
    .forEach(f=>{
      if(usedF.has(f)) return;
      let b=0,bi=-1;
      labels.forEach((lab,i)=>{
        if(usedCol.has(i)) return;
        const nl=norm(lab); if(!nl) return;
        let s=0; SYN[f].forEach(x=>{const v=sim(nl,x); if(v>s)s=v;});
        if(s>b){b=s;bi=i;}
      });
      if(bi>=0&&b>=0.38){ map[f]={col:bi,conf:b}; usedF.add(f); usedCol.add(bi); }
    });
  return map;
}

/* guess the discipline from sheet/file name and content */
function guessActivity(disc,sheetName,fileName){
  const d=DISCIPLINES.find(x=>x.sheet===disc);
  if(!d||!d.alt) return '';
  const hay=norm(sheetName+' '+fileName);
  if(/erect|installat|fixing/.test(hay)) return d.alt.find(a=>/erection/i.test(a))||'';
  if(/suppl|fabricat|delivery|dispatch/.test(hay)) return d.alt.find(a=>/supply/i.test(a))||'';
  return '';
}

/* last-resort agency guess: the leading words of the file name */
const MONTHS='jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec';
function agencyFromName(fileName){
  let s=fileName.replace(/\.[a-z0-9]+$/i,'').replace(/_/g,' ');
  s=s.split(/\s[-–—]\s/)[0];
  s=s.replace(/^\s*m\s*\/?\s*s\.?\s+/i,'').replace(/^[^a-z0-9]+/i,'');
  s=s.replace(new RegExp('\\d{1,2}\\s*(' + MONTHS + ')[a-z]*\\s*\\d{0,4}','ig'),' ')
     .replace(new RegExp('(' + MONTHS + ')[a-z]*\\s*\\d{1,4}','ig'),' ')
     .replace(/\d{1,4}[.\-\/]\d{1,2}[.\-\/]\d{2,4}/g,' ')
     .replace(/\b(dpr|daily|progress|report|sheet|format|final|draft|copy|update|status|rev|version|works?|data)\b/ig,' ')
     .replace(/\b(piling|civil|structural|structure|steel|equipment|mechanical|electrical|piping|cabling|cable|trays?|panels?|instrumentation)\b/ig,' ')
     .replace(/\b\d+\b/g,' ').replace(/[()\[\]]/g,' ').replace(/\s+/g,' ').trim();
  return s.length>=3&&s.length<=40 ? s : '';
}

function guessDiscipline(sheetName,fileName,labels){
  const hay=norm(sheetName+' '+fileName+' '+labels.join(' '));
  const rules=[
    [/pil(e|ing)|bored pile/,'Piling'],
    [/civil|concret|rcc|found(ation)?|cum\b/,'Civil'],
    [/structur|steel|fabricat|erection mt|\bmt\b/,'Structural'],
    [/equip|mechanic|machin/,'Equipment'],
    [/pip(e|ing)|inch dia|inch mtr/,'Piping'],
    [/cable tray|tray/,'Cable Trays (Km)'],
    [/cabl(e|ing)|ht lt cable|laying/,'Cabling (Km)'],
    [/panel|mcc|pcc|switchgear/,'Panels (Nos)'],
    [/manpower|labour|labor|workmen/,'Manpower']
  ];
  for(const [re,d] of rules) if(re.test(hay)) return d;
  return 'Civil';
}

<script>
/* =====================================================================
   Row extraction, master matching, aggregation
   ===================================================================== */

const TOTAL_RE = /^(sub\s*total|total|grand\s*total|g\.?\s*total|sum)\b/i;

function extractRows(sh){
  const {aoa,hdr,map}=sh;
  const {labels,consumed}=headerLabels(aoa,hdr);
  const start=hdr+consumed;
  const numKeys=['scope','drawing','front','last_month','plan_ftm','plan_ftd',
                 'ach_ftd','ach_ftm_prev','manpower'];
  const out=[]; let curArea=sh.area||'';
  for(let r=start;r<aoa.length;r++){
    const raw=aoa[r]||[];
    if(raw.every(c=>c==null||String(c).trim()==='')) continue;
    const get=f=>map[f]?raw[map[f].col]:null;
    const sname=String(get('structure')??'').trim();
    const nums=numKeys.map(k=>numf(get(k)));
    const anyNum=nums.some(v=>v!=null);

    /* a lone bit of text with no numbers = a section heading -> remember as Area */
    if(!anyNum){
      const texts=raw.filter(c=>c!=null&&String(c).trim()!=='');
      if(texts.length<=2 && texts.length>0){
        const t=String(texts[0]).trim();
        if(t && !TOTAL_RE.test(t) && t.length<60){ curArea=t; }
        continue;
      }
      if(!sname) continue;
    }
    if(TOTAL_RE.test(sname)) continue;                 // drop vendor's own totals
    if(!sname && !anyNum) continue;

    const rowArea = (map.area? String(get('area')??'').trim():'') || curArea || sh.area || 'Plant General';
    const rec={
      _src:sh.fileName+' › '+sh.name, _row:r+1,
      structure: sname || '(unnamed item)',
      area:      alias('area',rowArea),
      activity:  alias('activity',(map.activity?String(get('activity')??'').trim():'')||sh.activity||''),
      agency:    alias('agency',(map.agency?String(get('agency')??'').trim():'')||sh.agency||''),
      sheet:     sh.disc,
      reason:    map.reason ?String(get('reason') ??'').trim():'',
      remarks:   map.remarks?String(get('remarks')??'').trim():''
    };
    numKeys.forEach((k,i)=>rec[k]=nums[i]);
    if(!rec.activity) rec.activity=(DISCIPLINES.find(d=>d.sheet===sh.disc)||{}).act||sh.disc;
    out.push(rec);
  }
  return out;
}

function derive(r){
  r.variance = n0(r.plan_ftd)-n0(r.ach_ftd);
  r.ach_ftm  = n0(r.ach_ftd)+n0(r.ach_ftm_prev);
  r.workdone = n0(r.last_month)+r.ach_ftm;
  r.balance  = n0(r.scope)-r.workdone;
  r.pct      = n0(r.scope)>0 ? r.workdone/n0(r.scope) : null;
  return r;
}

/* --- match a vendor row against the master scope ------------------- */
function matchMaster(rec){
  if(!ST.master.length) return {m:null,score:0,state:'nomaster'};
  const vk=key(rec.sheet+'|'+rec.structure+'|'+rec.agency);
  if(ST.manual[vk]!=null){
    const m=ST.master[ST.manual[vk]];
    if(m) return {m:m,score:1,state:'manual',idx:ST.manual[vk]};
  }
  let best=null,bs=0,bi=-1;
  ST.master.forEach((m,i)=>{
    if(m.sheet && rec.sheet && m.sheet!==rec.sheet) return;
    const ss=sim(m.structure,rec.structure);
    const as=rec.agency  &&m.agency  ? sim(m.agency,rec.agency)     : 0.5;
    /* activity matters: a master carrying the same structure under both
       "Supply" and "Erection" must not collapse into one line */
    const ac=rec.activity&&m.activity? sim(m.activity,rec.activity) : 0.5;
    const ar=rec.area    &&m.area    ? sim(m.area,rec.area)         : 0.5;
    const s=ss*0.55+as*0.20+ac*0.15+ar*0.10;
    if(s>bs){bs=s;best=m;bi=i;}
  });
  if(bs>=0.72) return {m:best,score:bs,state:'auto',idx:bi};
  if(bs>=0.48) return {m:best,score:bs,state:'weak',idx:bi};
  return {m:null,score:bs,state:'new'};
}

function consolidate(){
  const all=[]; ST.unmatched=[];
  ST.files.forEach(f=>f.sheets.forEach(sh=>{
    if(!sh.use) return;
    sh.fileName=f.name;
    sh.rows=extractRows(sh);
    sh.rows.forEach(rec=>{
      const mt=matchMaster(rec);
      rec._match=mt.state; rec._score=mt.score; rec._midx=mt.idx;
      if(mt.m){
        rec.structure = mt.m.structure;
        rec.area      = mt.m.area     || rec.area;
        rec.activity  = mt.m.activity || rec.activity;
        rec.agency    = mt.m.agency   || rec.agency;
        rec.sheet     = mt.m.sheet    || rec.sheet;
        if(rec.scope==null && mt.m.scope!=null) rec.scope=mt.m.scope;
      }
      if(mt.state==='weak'||mt.state==='new') ST.unmatched.push(rec);
      all.push(derive(rec));
    });
  }));
  /* one spelling per name: "Material handling facilities" and
     "Material Handling Facilities" must not become two areas */
  canonicalise(all,'area'); canonicalise(all,'activity'); canonicalise(all,'agency');

  /* merge duplicate lines (same item reported in two files) */
  const seen=new Map();
  all.forEach(r=>{
    const k=key(r.sheet+'|'+r.area+'|'+r.activity+'|'+r.agency+'|'+r.structure);
    if(!seen.has(k)){ seen.set(k,r); r._dupes=1; return; }
    const p=seen.get(k); p._dupes++;
    ['drawing','front','last_month','plan_ftm','plan_ftd','ach_ftd','ach_ftm_prev','manpower']
      .forEach(f=>{ if(p[f]==null&&r[f]!=null)p[f]=r[f];
                    else if(p[f]!=null&&r[f]!=null) p[f]=Math.max(p[f],r[f]); });
    if(p.scope==null) p.scope=r.scope;
    if(!p.reason&&r.reason) p.reason=r.reason;
    if(!p.remarks&&r.remarks) p.remarks=r.remarks;
    p._src += ' + '+r._src;
    derive(p);
  });
  ST.rows=[...seen.values()];
  /* add master lines that no vendor reported today (zero progress, keeps scope honest) */
  if(ST.master.length && $('#optAllMaster') && $('#optAllMaster').checked){
    const have=new Set(ST.rows.map(r=>key(r.sheet+'|'+r.structure+'|'+r.agency)));
    ST.master.forEach(m=>{
      const k=key(m.sheet+'|'+m.structure+'|'+m.agency);
      if(have.has(k)) return;
      ST.rows.push(derive({_src:'master (not reported today)',structure:m.structure,area:m.area,
        activity:m.activity,agency:m.agency,sheet:m.sheet,scope:m.scope,drawing:null,front:null,
        last_month:m.last_month??null,plan_ftm:null,plan_ftd:null,ach_ftd:null,ach_ftm_prev:m.ach_ftm_prev??null,
        reason:'',remarks:'Not reported today',_match:'master',_score:1}));
    });
  }
  ST.rows.forEach(checkRow);
  ST.rows.sort((a,b)=> a.area.localeCompare(b.area)
      || ACTIVITIES.indexOf(a.activity)-ACTIVITIES.indexOf(b.activity)
      || a.activity.localeCompare(b.activity)
      || a.agency.localeCompare(b.agency)
      || a.structure.localeCompare(b.structure));
  return ST.rows;
}

/* pick one spelling for every distinct name and rewrite every row to use it */
function canonicalise(rows,field){
  const groups=new Map();
  rows.forEach(r=>{
    const v=(r[field]||'').trim(); if(!v) return;
    const k=norm(v); if(!k) return;
    if(!groups.has(k)) groups.set(k,new Map());
    const m=groups.get(k); m.set(v,(m.get(v)||0)+1);
  });
  const pick=new Map();
  const masterSpellings=new Set(ST.master.map(m=>(m[field]||'').trim()).filter(Boolean));
  groups.forEach((m,k)=>{
    let best=null,bs=-1;
    m.forEach((n,v)=>{
      let s=n;
      if(masterSpellings.has(v)) s+=1000;                 // the master always wins
      if(/[a-z]/.test(v)&&/[A-Z]/.test(v)) s+=0.5;        // prefer Title Case over ALL CAPS
      if(s>bs){bs=s;best=v;}
    });
    pick.set(k,best);
  });
  rows.forEach(r=>{ const v=(r[field]||'').trim(); if(!v)return;
    const c=pick.get(norm(v)); if(c) r[field]=c; });
}

/* arithmetic sanity checks — these are what a reviewer would query */
function checkRow(r){
  const out=[]; const s=n0(r.scope);
  const bad=k=>r[k]!=null&&r[k]<0;
  ['scope','drawing','front','last_month','plan_ftm','plan_ftd','ach_ftd','ach_ftm_prev']
    .forEach(k=>{ if(bad(k)) out.push('negative '+FIELDS.find(f=>f.k===k).h); });
  if(s>0){
    if(r.workdone>s*1.001) out.push('Workdone exceeds Scope by '+fmt(r.workdone-s,2));
    if(n0(r.front)>s*1.001) out.push('Front Available exceeds Scope');
    if(n0(r.drawing)>s*1.001) out.push('Drawing Released exceeds Scope');
  }else if(r.workdone>0||n0(r.ach_ftd)>0){
    out.push('progress reported against zero / missing Scope');
  }
  if(r._dupes>1) out.push('reported in '+r._dupes+' places — highest value kept');
  r._issues=out; return r;
}

const SUMNUM=['scope','drawing','front','workdone','plan_ftm','ach_ftm','ach_ftd','manpower'];
function blank(){ const o={}; SUMNUM.forEach(k=>o[k]=0); return o; }
function addInto(t,r){ SUMNUM.forEach(k=>t[k]+=n0(r[k])); return t; }
function finish(t){ t.pct = t.scope>0 ? t.workdone/t.scope : null;
                    t.balance = t.scope - t.workdone; return t; }

/* build the grouped Summary-AreaWise structure */
function buildSummary(){
  const areas=new Map();
  ST.rows.forEach(r=>{
    if(!areas.has(r.area)) areas.set(r.area,new Map());
    const acts=areas.get(r.area);
    if(!acts.has(r.activity)) acts.set(r.activity,new Map());
    const ags=acts.get(r.activity);
    const ag=r.agency||'Not allotted';
    if(!ags.has(ag)) ags.set(ag,blank());
    addInto(ags.get(ag),r);
  });
  const out=[]; const grand=blank();
  let ai=0;
  const areaOrder=[...areas.keys()].sort();
  areaOrder.forEach(area=>{
    out.push({type:'area', label:String.fromCharCode(65+(ai%26)), name:area});
    ai++;
    const acts=areas.get(area);
    const actOrder=[...acts.keys()].sort((x,y)=>{
      const ix=ACTIVITIES.indexOf(x), iy=ACTIVITIES.indexOf(y);
      return (ix<0?99:ix)-(iy<0?99:iy) || x.localeCompare(y);
    });
    let gi=0;
    actOrder.forEach(act=>{
      gi++;
      out.push({type:'act', label:String(gi), name:act});
      const ags=acts.get(act); const sub=blank();
      let si=0;
      [...ags.keys()].sort().forEach(ag=>{
        si++;
        const t=finish(Object.assign(blank(),ags.get(ag)));
        out.push({type:'row', label:gi+'.'+si, name:act, agency:ag, v:t});
        addInto(sub,ags.get(ag));
      });
      out.push({type:'sub', name:'Sub total: '+act, v:finish(sub)});
      addInto(grand,sub);
    });
  });
  out.push({type:'grand', name:'GRAND TOTAL', v:finish(grand)});
  return out;
}

    [1,7,1,0,C('left')],                               //28 input text
    [1,6,1,165,C('center')],                           //29 calc percent
    [1,10,1,0,C('left',null,1)]                        //30 wrapped text
  ];
  const S={TITLE:1,SUB:2,LOGO:3,HDR:4,CODE:5,TXT:6,NUM:7,PCT:8,KEY:9,CALC:10,INP:11,
           AREA:12,ACT:13,SUBN:14,SUBL:15,SUBP:16,GN:17,GL:18,GP:19,SL:20,LABR:21,
           DATE:22,NUM2:23,NOTE:24,H2:25,B:26,REDN:27,INPT:28,CALCP:29,WRAP:30};
