<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drone Analytics Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F4E9E'/%3E%3Cpath d='M16 6l10 10-10 10L6 16z' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23E5202E'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/studio.css">
</head>
<body>
  <div id="home" hidden></div>

  <div id="studio" hidden>
    <header id="topbar">
      <button id="btn-home" class="ghost" title="All projects">◆ <span>Projects</span></button>
      <div class="proj-title">
        <div id="proj-name"></div>
        <div id="proj-sub"></div>
      </div>
      <div class="grow"></div>
      <span id="save-state" class="save saved"></span>
      <button id="btn-undo" class="ghost icon" title="Undo (Ctrl+Z)">↶</button>
      <button id="btn-redo" class="ghost icon" title="Redo (Ctrl+Y)">↷</button>
      <button id="btn-help" class="ghost" title="Quick guide">? Guide</button>
      <button id="btn-preview" title="Play the whole video (from the selected scene)">▶ Preview</button>
      <button id="btn-export" class="primary" title="MP4 video, PowerPoint and stills">⬇ Export</button>
    </header>
    <main id="workspace">
      <aside id="left"></aside>
      <section id="center">
        <div id="stage-toolbar"></div>
        <div id="stage-wrap"><canvas id="stage"></canvas></div>
        <div id="transport"></div>
      </section>
      <aside id="right"><div id="inspector"></div></aside>
    </main>
    <footer id="storyboard"></footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
