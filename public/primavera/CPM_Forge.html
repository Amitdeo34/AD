<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CPM Forge</title>
<style>
:root{
  --ground:#EEF2F7; --surface:#FFFFFF; --surface2:#F4F7FB; --ink:#0C233C; --muted:#4D5B70; --faint:#8793A6; --line:#C9D2DF; --line2:#E3E8F0;
  --accent:#00338D; --accent-ink:#FFFFFF; --accent-soft:#E0E9F8; --sel:#D5E9F9; --sel-line:#005EB8; --focus:#005EB8; --pick:#E8F1FB; --cur:#00338D;
  --hdr:#00338D; --hdr2:#002670; --hdr-ink:#FFFFFF; --gh:#E6ECF4; --gh-ink:#00338D;
  --w1:#00338D; --w1t:#FFFFFF; --w2:#005EB8; --w2t:#FFFFFF; --w3:#0091DA; --w3t:#FFFFFF; --w4:#483698; --w4t:#FFFFFF; --w5:#470A68; --w5t:#FFFFFF;
  --w6:#00A3A1; --w6t:#FFFFFF; --w7:#B8D6F0; --w7t:#0C233C; --w8:#DDEAF7; --w8t:#0C233C;
  --bar:#009A44; --crit:#BC204B; --act:#00338D; --bl:#EAAA00; --ms:#0C233C; --sum:#0C233C; --dd:#C6007E; --float:#7CC6C5; --nonwork:#F0F3F8; --rel:#7B879A; --reldrv:#BC204B;
  --good:#009A44; --warn:#D9740B; --bad:#BC204B;
  --shadow:0 10px 30px rgba(0,30,80,.18); --r:4px;
  --f-ui:Arial,"Helvetica Neue",Helvetica,sans-serif; --f-grid:Arial,"Helvetica Neue",Helvetica,sans-serif; --f-disp:Arial,"Helvetica Neue",Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#07111F; --surface:#0C1A2E; --surface2:#11223A; --ink:#E8EEF7; --muted:#A3B1C6; --faint:#6F7E95; --line:#243650; --line2:#1A2B43;
  --accent:#6FA8FF; --accent-ink:#06101F; --accent-soft:#16305A; --sel:#16365F; --sel-line:#4FB3F0; --focus:#6FA8FF; --pick:#132B4A; --cur:#8CC4FF;
  --hdr:#0A2658; --hdr2:#071C44; --hdr-ink:#FFFFFF; --gh:#11223A; --gh-ink:#BFD6FF;
  --w1:#0A3A99; --w1t:#FFFFFF; --w2:#0B4F9E; --w2t:#FFFFFF; --w3:#0A6E9F; --w3t:#FFFFFF; --w4:#3F327F; --w4t:#FFFFFF; --w5:#4A1670; --w5t:#FFFFFF;
  --w6:#0B7775; --w6t:#FFFFFF; --w7:#1D3556; --w7t:#DCE7F6; --w8:#162A45; --w8t:#D5E1F1;
  --bar:#2DBE6C; --crit:#F0567E; --act:#5E9BFF; --bl:#F5C33B; --ms:#E8EEF7; --sum:#BFD0E8; --dd:#FF4FB8; --float:#3E8C8B; --nonwork:#0A1728; --rel:#8595AC; --reldrv:#F0567E;
  --good:#3DD17F; --warn:#F5A04A; --bad:#F0567E; --shadow:0 10px 30px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --ground:#07111F; --surface:#0C1A2E; --surface2:#11223A; --ink:#E8EEF7; --muted:#A3B1C6; --faint:#6F7E95; --line:#243650; --line2:#1A2B43;
  --accent:#6FA8FF; --accent-ink:#06101F; --accent-soft:#16305A; --sel:#16365F; --sel-line:#4FB3F0; --focus:#6FA8FF; --pick:#132B4A; --cur:#8CC4FF;
  --hdr:#0A2658; --hdr2:#071C44; --hdr-ink:#FFFFFF; --gh:#11223A; --gh-ink:#BFD6FF;
  --w1:#0A3A99; --w1t:#FFFFFF; --w2:#0B4F9E; --w2t:#FFFFFF; --w3:#0A6E9F; --w3t:#FFFFFF; --w4:#3F327F; --w4t:#FFFFFF; --w5:#4A1670; --w5t:#FFFFFF;
  --w6:#0B7775; --w6t:#FFFFFF; --w7:#1D3556; --w7t:#DCE7F6; --w8:#162A45; --w8t:#D5E1F1;
  --bar:#2DBE6C; --crit:#F0567E; --act:#5E9BFF; --bl:#F5C33B; --ms:#E8EEF7; --sum:#BFD0E8; --dd:#FF4FB8; --float:#3E8C8B; --nonwork:#0A1728; --rel:#8595AC; --reldrv:#F0567E;
  --good:#3DD17F; --warn:#F5A04A; --bad:#F0567E; --shadow:0 10px 30px rgba(0,0,0,.55);
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:13px/1.35 var(--f-ui);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.app{height:100%;display:flex;flex-direction:column;min-height:0}
/* command bar */
.bar{display:flex;align-items:center;gap:6px;padding:6px 12px;background:linear-gradient(90deg,var(--hdr),var(--hdr2));color:var(--hdr-ink);border-bottom:3px solid #0091DA;flex-wrap:wrap;row-gap:4px}
.bar .btn{height:28px;padding:0 8px;font-size:12.5px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28);color:var(--hdr-ink)}
.bar .btn:hover{border-color:#fff;background:rgba(255,255,255,.18)}
.bar .btn.ghost{background:transparent;border-color:transparent}
.bar .btn.ghost:hover{background:rgba(255,255,255,.16)}
.bar .btn.pri{background:#fff;border-color:#fff;color:#00338D;font-weight:700}
.bar .sep{background:rgba(255,255,255,.3)}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:6px;white-space:nowrap}
.brand b{font:700 19px/1 var(--f-disp);letter-spacing:.01em;color:#fff}
.brand span{font:500 12px/1 var(--f-ui);color:#CFE0FF;max-width:18ch;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface2);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--accent-soft)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px;flex:none}
.menu{position:relative}
.menu>.pop{position:absolute;top:34px;left:0;z-index:40;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:5px;display:flex;flex-direction:column}
.pop button{all:unset;display:flex;justify-content:space-between;gap:18px;padding:7px 10px;border-radius:4px;cursor:pointer;white-space:nowrap}
.pop button:hover,.pop button:focus-visible{background:var(--accent-soft)}
.pop kbd{font:11px var(--f-grid);color:var(--faint)}
.pop hr{border:0;border-top:1px solid var(--line2);margin:4px 2px}
.pop{color:var(--ink)}
/* status strip */
.strip{display:flex;align-items:center;gap:10px;padding:5px 12px;background:var(--surface2);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);overflow-x:auto;white-space:nowrap;scrollbar-width:thin}
.strip b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.chip.bad{color:var(--bad);border-color:currentColor}
.chip.warn{color:var(--warn);border-color:currentColor}
.chip.ok{color:var(--good);border-color:currentColor}
.strip select,.strip input[type=search]{height:26px;border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:0 6px}
.strip input[type=search]{width:170px}
.demo-note{color:var(--warn);font-weight:600}
/* main split */
.main{flex:1;display:flex;min-height:0;position:relative}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface)}
.pane.grid{flex:0 0 auto;width:52%}
.pane.gantt{flex:1}
.splitter{flex:0 0 6px;cursor:col-resize;background:var(--line2);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.splitter:hover{background:var(--accent-soft)}
.ghead{height:44px;flex:none;overflow:hidden;position:relative;border-bottom:2px solid var(--accent);background:var(--gh)}
.gbody{flex:1;overflow:auto;position:relative;min-height:0;overscroll-behavior:contain}
.hrow{position:absolute;top:0;left:0;display:flex;height:44px}
.hcell{position:relative;flex:none;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 4px;font:700 11.5px/1.15 var(--f-grid);color:var(--gh-ink);border-right:1px solid var(--line);cursor:pointer;user-select:none}
.hcell.cur{background:var(--accent-soft);box-shadow:inset 0 -3px 0 var(--accent)}
.hcell:hover{color:var(--ink)}
.hcell .rz{position:absolute;right:-3px;top:0;width:7px;height:100%;cursor:col-resize;z-index:2}
.rows{position:relative}
.row{position:absolute;left:0;display:flex;height:24px;border-bottom:1px solid var(--line2);font:12.5px/23px var(--f-grid);font-variant-numeric:tabular-nums;cursor:default}
.cell{flex:none;padding:0 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-right:1px solid var(--line2)}
.cell.num,.cell.date{text-align:center}
.row.wbs{font-weight:600}
.row.l1{background:var(--w1);color:var(--w1t)} .row.l2{background:var(--w2);color:var(--w2t)} .row.l3{background:var(--w3);color:var(--w3t)} .row.l4{background:var(--w4);color:var(--w4t)} .row.l5{background:var(--w5);color:var(--w5t)} .row.l6{background:var(--w6);color:var(--w6t)} .row.l7{background:var(--w7);color:var(--w7t)} .row.l8{background:var(--w8);color:var(--w8t)}
.row.wbs .cell{border-right-color:transparent}
.row.act:hover{background:var(--surface2)}
.row.picked{background:var(--pick)!important;color:var(--ink)}
.row.selected{background:var(--sel)!important;box-shadow:inset 4px 0 0 var(--sel-line);color:var(--ink)}
.row.wbs.selected,.row.wbs.picked{color:var(--ink)}
.cell.cur{outline:2px solid var(--cur);outline-offset:-2px;background:var(--surface);color:var(--ink)}
.gbody:not(:focus-within) .cell.cur{outline-style:dashed;outline-color:var(--faint)}
.cell.ro-cell.cur{background:var(--surface2)}
.cell.fz{position:sticky;z-index:1;background:inherit}
.row.act .cell.fz{background:var(--surface)} .row.act:hover .cell.fz{background:var(--surface2)}
.row.act.picked .cell.fz{background:var(--pick)} .row.act.selected .cell.fz{background:var(--sel)}
.cell.fzl{box-shadow:2px 0 0 var(--line)}
.row .cell.cur,.row.act.selected .cell.cur{background:var(--surface)}
.hcell.fz{z-index:3;background:var(--gh)} .hcell.fzl{box-shadow:2px 0 0 var(--line)}
.cnt{font-size:10.5px;font-weight:600;opacity:.75;margin-left:6px}
.row.act.selected .cell:not(.cur),.row.act.picked .cell:not(.cur){border-right-color:color-mix(in srgb,var(--sel-line) 18%,transparent)}
.tw{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-right:4px;border:1px solid currentColor;border-radius:3px;cursor:pointer;font:700 12px/1 var(--f-grid);opacity:.85;vertical-align:-2px}
.tw:hover{opacity:1;background:rgba(255,255,255,.2)}
.crit-tf{color:var(--bad);font-weight:700}
.neg{background:color-mix(in srgb,var(--bad) 16%,transparent)}
.cell .a{font-size:10px;font-weight:700;margin-left:2px;opacity:.75}
.cell.edit{padding:0;overflow:visible}
.cell.edit input,.cell.edit select{width:100%;height:23px;border:2px solid var(--cur);outline:none;border-radius:2px;background:var(--surface);padding:0 3px;font:12.5px var(--f-grid)}
.badge{display:inline-block;padding:0 5px;border-radius:3px;font-size:10.5px;font-weight:700;line-height:15px}
.badge.lp{background:var(--crit);color:#fff} .badge.cr{border:1px solid var(--crit);color:var(--crit)}
.st-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
/* gantt */
.gantt .gbody{overflow:auto}
.gcanvas{position:sticky;left:0;top:0;display:block}
.ghead canvas{position:absolute;left:0;top:0}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:7px 9px;font:12px/1.45 var(--f-grid);font-variant-numeric:tabular-nums;max-width:320px}
.tip b{font-family:var(--f-ui)}
/* details drawer */
.drawer{flex:none;height:230px;display:flex;flex-direction:column;background:var(--surface);border-top:1px solid var(--line);min-height:0}
.drawer.closed{height:34px}
.tabs{display:flex;align-items:center;gap:2px;padding:0 8px;height:34px;flex:none;border-bottom:1px solid var(--line);background:var(--surface2);overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:7px 12px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .title{margin-left:auto;font:600 12px var(--f-grid);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.dbody{flex:1;overflow:auto;padding:10px 12px;min-height:0}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 14px;align-items:end}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.f input,.f select,.f textarea{height:30px;border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:0 8px;min-width:0}
.f textarea{height:auto;padding:6px 8px;font:12px/1.4 var(--f-grid)}
.f .ro{height:30px;display:flex;align-items:center;padding:0 8px;border-radius:4px;background:var(--surface2);border:1px dashed var(--line);font:600 12.5px var(--f-grid);font-variant-numeric:tabular-nums}
.f .ro.bad{color:var(--bad)} .f .ro.good{color:var(--good)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tbl{width:100%;border-collapse:collapse;font:12.5px/1.3 var(--f-grid);font-variant-numeric:tabular-nums}
.tbl th{font:600 11px var(--f-ui);text-transform:uppercase;letter-spacing:.03em;color:var(--muted);text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.tbl td{padding:4px 6px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl tr.drv td:first-child{box-shadow:inset 3px 0 0 var(--reldrv)}
.tbl a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600}
.tbl input,.tbl select{height:24px;border:1px solid var(--line);border-radius:3px;background:var(--surface);padding:0 4px;width:100%}
.x{all:unset;cursor:pointer;color:var(--faint);padding:0 6px;font-size:14px}
.x:hover{color:var(--bad)}
.addrow{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.addrow input,.addrow select{height:28px;border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:0 6px}
.muted{color:var(--muted)} .small{font-size:11.5px}
/* dialogs */
dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(10,18,30,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 50px)}
.dlg h2{margin:0;font:700 20px/1.1 var(--f-disp);letter-spacing:.01em;text-wrap:balance}
.dlg header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg .body{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg footer{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.drop{border:2px dashed var(--line);border-radius:8px;padding:18px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font:12.5px/1.4 var(--f-grid)}
.log li{padding:4px 8px;border-radius:4px;background:var(--surface2);border-left:3px solid var(--line)}
.log li.err{border-left-color:var(--bad)} .log li.warn{border-left-color:var(--warn)} .log li.info{border-left-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface2)}
.kpi b{display:block;font:700 20px/1.1 var(--f-disp);font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--muted)}
.kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)} .kpi.good b{color:var(--good)}
.chk{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:12.5px}
.pill{padding:1px 8px;border-radius:99px;font:700 11px var(--f-grid)}
.pill.pass{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.fail{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font:12px var(--f-grid);text-align:center}
.calgrid .h{color:var(--muted);font-weight:700;font-size:10.5px}
.calgrid .d{padding:5px 0;border-radius:4px;cursor:pointer;border:1px solid var(--line2)}
.calgrid .d.nw{background:var(--nonwork);color:var(--faint)}
.calgrid .d.hol{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad);font-weight:700}
.calgrid .d.xw{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good);font-weight:700}
.calgrid .d.dd{outline:2px solid var(--dd)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:8px;box-shadow:var(--shadow);font-weight:600;max-width:calc(100vw - 32px)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:8px;border-radius:2px;margin-right:5px;vertical-align:1px}
/* mobile view switcher */
.vtabs{display:none}
@media (max-width:760px){
  .vtabs{display:flex;gap:4px;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
  .vtabs .btn{flex:1;justify-content:center}
  .splitter{display:none}
  .pane.grid{width:100%!important;flex:1}
  .main[data-view="table"] .pane.gantt,.main[data-view="gantt"] .pane.grid,.main[data-view="details"] .pane{display:none}
  .main[data-view="details"] ~ .drawer{flex:1;height:auto}
  .main[data-view="details"]{flex:0 0 0}
  .drawer{height:0;border-top:0} .drawer.closed{height:0}
  .main[data-view="details"] ~ .drawer.closed{height:auto}
  .brand span{display:none}
  .bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}
  .strip input[type=search]{width:120px}
  .cols2{grid-template-columns:1fr}
}
/* level control, palette, context menu, hints */
.lvl{display:inline-flex;align-items:center;gap:2px;padding:1px 3px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.lvl b{font-size:11px;color:var(--muted);padding:0 4px;font-weight:700}
.lvl button{all:unset;cursor:pointer;min-width:20px;height:22px;padding:0 5px;text-align:center;border-radius:3px;font:700 11.5px/22px var(--f-grid);color:var(--accent)}
.lvl button:hover{background:var(--accent-soft)}
.lvl button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip.link{cursor:pointer}
.chip.link:hover{border-color:var(--accent)}
.ctx{position:fixed;z-index:80;min-width:250px;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:var(--r);box-shadow:var(--shadow);padding:5px;display:flex;flex-direction:column}
.ctx button{all:unset;display:flex;justify-content:space-between;gap:18px;padding:6px 10px;border-radius:3px;cursor:pointer;white-space:nowrap}
.ctx button:hover,.ctx button:focus-visible{background:var(--accent-soft)}
.ctx kbd{font:11px var(--f-grid);color:var(--faint)}
.ctx hr{border:0;border-top:1px solid var(--line2);margin:4px 2px}
.pal{position:fixed;inset:0;z-index:90;background:rgba(5,15,35,.45);display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
.pal>div{width:min(620px,calc(100vw - 32px));background:var(--surface);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;border-top:4px solid var(--accent)}
.pal input{width:100%;height:46px;border:0;border-bottom:1px solid var(--line);padding:0 16px;font-size:15px;background:var(--surface);outline:none}
.pal ul{list-style:none;margin:0;padding:4px;max-height:52vh;overflow:auto}
.pal li{display:flex;justify-content:space-between;gap:12px;padding:7px 12px;border-radius:4px;cursor:pointer;font-size:13px}
.pal li[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.pal li small{opacity:.7}
.pal li .k{font:600 10.5px var(--f-grid);padding:1px 6px;border-radius:3px;background:var(--accent-soft);color:var(--accent);margin-right:8px}
.pal li[aria-selected="true"] .k{background:rgba(255,255,255,.2);color:inherit}
.hint{position:absolute;right:10px;bottom:8px;z-index:3;font:11px var(--f-grid);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:3px 8px;pointer-events:none;opacity:.92}
.hint kbd{font:700 10.5px var(--f-grid);color:var(--accent)}
.pane.grid{position:relative}
@media (max-width:760px){.hint{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

    <button class="btn pri" id="btnF9" title="Schedule now (F9)">Schedule F9</button>

    <span>Data date <b id="sDD">-</b></span>

<script>
/* ==== engine.js ==== */
/* CPM Forge - scheduling engine (CPM with calendars). Same math as the Excel workbook formulas.
   Dates are Excel serial day numbers. Moments: start of day D = D, end of day D = D + 0.5. */
(function (root) {
  'use strict';
  const E = {};
  const MS = 86400000, EPOCH = Date.UTC(1899, 11, 30);
  const BIG = 1e6;
  E.BIG = BIG;
  E.TABLE_N = 6000;          // calendar table length (days) - must match Excel CalEngine
  E.MAX_CALS = 10;           // user calendars; index 11 = 24 hour (all days working)
  E.CONS = ['Start On or After', 'Finish On or After', 'Start On or Before', 'Finish On or Before',
    'Start On', 'Finish On', 'Mandatory Start', 'Mandatory Finish', 'As Late As Possible'];
  E.TYPES = ['WBS', 'Task', 'Start MS', 'Finish MS', 'LOE'];
  E.REL = ['FS', 'SS', 'FF', 'SF'];
  E.LAGCAL = ['Predecessor', 'Successor', '24 Hour', 'Project Default'];

  /* ---------- dates ---------- */
  E.serial = (y, m, d) => Math.round((Date.UTC(y, m - 1, d) - EPOCH) / MS);
  E.ymd = s => { const t = new Date(EPOCH + Math.round(s) * MS); return [t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()]; };
  E.weekday = s => ((((Math.floor(s) - 2) % 7) + 7) % 7) + 1; // Excel WEEKDAY(s,2): Mon=1..Sun=7
  E.today = () => { const t = new Date(); return E.serial(t.getFullYear(), t.getMonth() + 1, t.getDate()); };
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  E.MON = MON;
  E.fmt = (s, long) => {
    if (s === null || s === undefined || s === '' || isNaN(s)) return '';
    const [y, m, d] = E.ymd(s);
    return String(d).padStart(2, '0') + '-' + MON[m - 1] + '-' + (long ? y : String(y).slice(-2));
  };
  E.iso = s => { if (s == null || s === '') return ''; const [y, m, d] = E.ymd(s); return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0'); };
  /* Parse anything a P6 export / user may give: serial number, Date, ISO, dd-Mon-yy[yy] [hh:mm] [A|*], dd/mm/yyyy */
  E.parseDate = v => {
    if (v === null || v === undefined || v === '') return null;
    if (v instanceof Date) return isNaN(v) ? null : E.serial(v.getFullYear(), v.getMonth() + 1, v.getDate()) + (v.getHours() >= 17 ? 0 : 0);
    if (typeof v === 'number') return v > 0 && v < 200000 ? Math.floor(v) : null;
    let s = String(v).trim().replace(/[*]/g, '').replace(/\s+A$/i, '').trim();
    if (!s) return null;
    if (/^\d+(\.\d+)?$/.test(s)) { const n = parseFloat(s); return n > 0 && n < 200000 ? Math.floor(n) : null; }
    let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
    if (m) return E.serial(+m[1], +m[2], +m[3]);
    m = s.match(/^(\d{1,2})[-\s/.]([A-Za-z]{3,9})[-\s/.,]*(\d{2,4})/);
    if (m) {
      const mi = MON.findIndex(x => x.toLowerCase() === m[2].slice(0, 3).toLowerCase());
      if (mi >= 0) { let y = +m[3]; if (y < 100) y += 2000; return E.serial(y, mi + 1, +m[1]); }
    }
    m = s.match(/^([A-Za-z]{3,9})[-\s/.](\d{1,2})[-\s/.,]+(\d{2,4})/);
    if (m) {
      const mi = MON.findIndex(x => x.toLowerCase() === m[1].slice(0, 3).toLowerCase());
      if (mi >= 0) { let y = +m[3]; if (y < 100) y += 2000; return E.serial(y, mi + 1, +m[2]); }
    }
    m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);
    if (m) { let y = +m[3]; if (y < 100) y += 2000; return E.serial(y, +m[2], +m[1]); } // dd/mm/yyyy (India)
    const t = Date.parse(s);
    if (!isNaN(t)) { const d = new Date(t); return E.serial(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
    return null;
  };

  /* ---------- calendars: strictly increasing key table (same as Excel CalEngine) ----------
     key[0] = 0 (sentinel = base-1). key[i] (date base+i-1) = floor(key[i-1]) + (work ? 1 : i/(2*(N+2)))
     Cum(k,D) = floor(key[clamp(D-base+1,0,N)])   WD(k,n) = date of largest key <= max(n,1)          */
  function CalSet(project) {
    const N = E.TABLE_N;
    const start = project.start || E.today();
    this.base = E.serial(E.ymd(start)[0] - 2, 1, 1);
    this.N = N;
    const cals = (project.calendars || []).slice(0, E.MAX_CALS);
    this.names = cals.map(c => String(c.name || '').trim());
    this.keys = [];
    const denom = 2 * (N + 2);
    const exc = new Map(); // "k|date" -> 'W' | 'H'
    cals.forEach((c, i) => (c.exceptions || []).forEach(x => {
      const d = E.parseDate(x.date); if (d == null) return;
      const key = (i + 1) + '|' + d; const t = /^w/i.test(x.type || '') ? 'W' : 'H';
      if (t === 'W' || !exc.has(key)) exc.set(key, t);  // Working wins (Excel checks Working first)
    }));
    for (let k = 1; k <= E.MAX_CALS + 1; k++) {
      const key = new Float64Array(N + 1);
      const c = cals[k - 1];
      for (let i = 1; i <= N; i++) {
        const d = this.base + i - 1;
        let w;
        if (k === E.MAX_CALS + 1) w = 1;
        else if (!c || !this.names[k - 1]) w = 0;
        else {
          const x = exc.get(k + '|' + d);
          if (x === 'W') w = 1; else if (x === 'H') w = 0;
          else w = Number(c.week && c.week[E.weekday(d) - 1]) === 1 ? 1 : 0;
        }
        key[i] = Math.floor(key[i - 1]) + (w === 1 ? 1 : i / denom);
      }
      this.keys[k] = key;
    }
  }
  CalSet.prototype.idx = function (name) {
    const n = String(name == null ? '' : name).trim().toUpperCase();
    for (let i = 0; i < this.names.length; i++) if (this.names[i].toUpperCase() === n && n) return i + 1;
    return 0;
  };
  CalSet.prototype.cum = function (k, D) {
    let i = Math.floor(D) - this.base + 1;
    if (!(i >= 0)) i = 0; if (i > this.N) i = this.N;
    return Math.floor(this.keys[k][i]);
  };
  CalSet.prototype.wd = function (k, n) {
    const key = this.keys[k]; const v = Math.max(n, 1);
    let lo = 0, hi = this.N; // largest i with key[i] <= v
    if (key[0] > v) return this.base - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (key[mid] <= v) lo = mid; else hi = mid - 1; }
    return this.base - 1 + lo;
  };
  CalSet.prototype.isWork = function (k, D) { return this.cum(k, D) - this.cum(k, D - 1) === 1; };
  E.CalSet = CalSet;

  /* ---------- helpers ---------- */
  const num = v => (v === null || v === undefined || v === '' || isNaN(+v)) ? 0 : +v;
  const up = s => String(s == null ? '' : s).trim().toUpperCase();
  E.consCode = c => { const i = E.CONS.findIndex(x => x.toUpperCase() === up(c)); return i + 1; };
  E.relCode = t => { const i = E.REL.indexOf(up(t)); return i < 0 ? 1 : i + 1; };
  E.typeCode = (type, od) => { const t = up(type); if (t === 'WBS') return 9; if (t === 'START MS') return 1; if (t === 'FINISH MS') return 2; return num(od) === 0 ? 1 : 0; };
  E.wbsParent = code => { const s = String(code || ''); const i = s.lastIndexOf('.'); return i < 0 ? '' : s.slice(0, i); };
  E.wbsLevel = code => String(code || '').split('.').length;

  if (typeof module !== 'undefined' && module.exports) module.exports = E; else root.P6E = E;
  E._num = num; E._up = up;
})(typeof window !== 'undefined' ? window : globalThis);

/* ==== cpm.js ==== */
/* CPM Forge - CPM schedule (forward/backward pass, float, longest path, WBS roll-up).
   Every step mirrors a column formula in the Excel workbook (see xlsxbook.js). */
(function (root) {
  'use strict';
  const E = (typeof module !== 'undefined' && module.exports) ? require('./engine.js') : root.P6E;
  const BIG = E.BIG, num = E._num, up = E._up;
  const xround = x => { const v = +(+x).toPrecision(15); return v < 0 ? -Math.round(-v) : Math.round(v); };
  E.xround = xround;

  E.schedule = function (P) {
    const t0 = Date.now();
    const cs = new E.CalSet(P);
    const defK = cs.idx(P.defCal) || 1;
    const RL = (P.progress || 'RL') !== 'PO';
    const lagOpt = [1, 2, 3, 4].includes(+P.lagCal) ? +P.lagCal : 1;
    const PS = E.parseDate(P.start), DD = E.parseDate(P.dataDate) ?? PS;
    const MF = E.parseDate(P.mustFinish);
    const crit = num(P.critFloat);
    const acts = P.activities || [];
    const n = acts.length;
    const A = new Array(n), idMap = new Map();
    const log = [];
    /* ---- static activity columns ---- */
    for (let i = 0; i < n; i++) {
      const a = acts[i], r = { i, a, wbs: up(a.type) === 'WBS', out: [], inc: [] };
      A[i] = r;
      if (r.wbs) continue;
      const id = up(a.id);
      if (id) { if (idMap.has(id)) log.push({ lvl: 'err', msg: 'Duplicate Activity ID ' + a.id }); else idMap.set(id, i); }
      r.k = cs.idx(String(a.cal || '').trim() ? a.cal : P.defCal) || 1;
      r.tc = E.typeCode(a.type, a.od);
      r.as = E.parseDate(a.as); r.af = E.parseDate(a.af);
      r.st = r.af != null ? 2 : r.as != null ? 1 : 0;
      const od = num(a.od), rdo = (a.rdo === '' || a.rdo == null) ? null : num(a.rdo);
      r.d = r.st === 2 ? 0 : r.tc > 0 ? 0 : rdo != null ? rdo : r.st === 1 ? xround(od * (1 - num(a.pct) / 100)) : od;
      r.cd = E.parseDate(a.consDate);
      const cc = E.consCode(a.cons);
      r.ct = !a.cons ? 0 : (r.cd == null && cc !== 9) ? 0 : cc;
      r.pctE = r.st === 2 ? 100 : r.st === 0 ? 0 : (a.pct !== '' && a.pct != null ? num(a.pct) : (od > 0 ? (od - r.d) / od * 100 : 0));
    }
    /* ---- static relationship columns ---- */
    const R = (P.rels || []).map((x, j) => {
      const p = idMap.has(up(x.pred)) ? idMap.get(up(x.pred)) : -1;
      const s = idMap.has(up(x.succ)) ? idMap.get(up(x.succ)) : -1;
      const T = E.relCode(x.type), L = xround(num(x.lag));
      const ok = p >= 0 && s >= 0 && p !== s;
      const rp = ok ? A[p] : null, rs = ok ? A[s] : null;
      const kp = p >= 0 ? A[p].k : 1, ks = s >= 0 ? A[s].k : 1;
      const kl = [kp, ks, E.MAX_CALS + 1, defK][lagOpt - 1];
      const rel = { j, x, p, s, T, L, ok, kp, ks, kl };
      if (ok) {
        rel.W = rs.st === 0 || (rs.st === 1 && RL && (T === 1 || T === 3 || T === 4));
        rel.AC = rel.W && rp.st !== 2 && !(rp.st === 1 && (T === 2 || T === 4));
        rel.Yend = (T === 1 || T === 3) ? rp.tc !== 1 : rp.tc === 2;
        rp.out.push(rel); rs.inc.push(rel);
      } else {
        rel.W = rel.AC = false;
        if (p < 0 || s < 0) log.push({ lvl: 'err', msg: 'Relationship ' + (x.pred || '?') + ' -> ' + (x.succ || '?') + ': activity not found' });
        else log.push({ lvl: 'warn', msg: 'Relationship ' + x.pred + ' -> ' + x.succ + ' links an activity to itself' });
      }
      return rel;
    });
    /* ---- topological order (Kahn) ---- */
    const indeg = new Int32Array(n); const order = [];
    for (const r of R) if (r.ok) indeg[r.s]++;
    const q = []; for (let i = 0; i < n; i++) if (!A[i].wbs && indeg[i] === 0) q.push(i);
    for (let h = 0; h < q.length; h++) { const i = q[h]; order.push(i); for (const r of A[i].out) if (--indeg[r.s] === 0) q.push(r.s); }
    const loops = [];
    for (let i = 0; i < n; i++) if (!A[i].wbs && indeg[i] > 0) { A[i].loop = true; loops.push(A[i].a.id); }
    if (loops.length) log.push({ lvl: 'err', msg: 'Logic loop (circular relationships) through ' + loops.length + ' activities: ' + loops.slice(0, 12).join(', ') + (loops.length > 12 ? ' ...' : '') });
    const cum = (k, D) => cs.cum(k, D), wd = (k, m) => cs.wd(k, m);
    /* ---- forward pass ---- */
    for (const i of order) {
      const r = A[i], k = r.k, d = r.d, st = r.st, tc = r.tc, ct = r.ct, cd = r.cd;
      let rsA = 0, rsFS = 0, rf = 0;
      for (const rel of r.inc) {
        if (rel.ReqS > rsA) rsA = rel.ReqS;
        if (rel.T === 1 && rel.ReqS > rsFS) rsFS = rel.ReqS;
        if (rel.ReqF > rf) rf = rel.ReqF;
      }
      const cF = (ct === 2 || ct === 6) ? cd + 0.5 : 0;
      const S1 = st === 0 ? Math.max(PS, DD, rsA, (ct === 1 || ct === 5) ? cd : 0) : st === 1 ? (RL ? Math.max(DD, rsFS) : DD) : 0;
      const F1 = st === 0 ? Math.max(rf, cF) : st === 1 ? (RL ? Math.max(rf, cF) : 0) : 0;
      if (st === 2) { r.ES = r.as != null ? r.as : r.af; r.EF = r.af; r.rES = null; }
      else {
        const nS = tc === 2 ? cum(k, Math.floor(S1) - 1) + 1 : cum(k, Math.ceil(S1) - 1) + 1;
        const nF = F1 === 0 ? 0 : (tc === 1 ? cum(k, Math.ceil(F1) - 1) + 1 : cum(k, Math.floor(F1) - 1) + 1);
        let nEF;
        if (st === 0 && ct === 7) nEF = cum(k, cd - 1) + 1 + (tc === 0 ? Math.max(d, 1) - 1 : 0);
        else if (st === 0 && ct === 8) nEF = cum(k, cd - 1) + 1;

      [{ label: 'Cancel' }, { label: 'Load schedule', cls: 'pri', id: 'iLoad', act: () => { if (!res) return false; U.load(res.project); U.toast('Loaded ' + res.project.activities.length + ' rows - scheduled with CPM'); } }], () => { $('iLoad').disabled = true; });
    const body = $('dlgBody');
    const fin = $('fileIn'); fin.value = ''; fin.onchange = () => { if (fin.files[0]) take(fin.files[0]); };
    const drop = $('iDrop');
    if (drop) {
      drop.onclick = () => { const fi = $('fileIn'); fi.value = ''; fi.click(); };
      drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); drop.click(); } };
      ['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
      ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
      drop.addEventListener('drop', e => { const fl = e.dataTransfer.files[0]; if (fl) take(fl); });
    }
    $('iPasteGo').onclick = () => { const t = $('iPaste').value; if (!t.trim()) { U.toast('Paste some rows first'); return; } src = { kind: 'text', text: t, name: 'Pasted schedule' }; parse(); };
    body.onchange = e => {
      const id = e.target.id, v = e.target.value; if (!src) return;
      if (id === 'oProj') o.projId = v; else if (id === 'oDD') o.dataDate = E.parseDate(v); else if (id === 'oStart') o.start = E.parseDate(v);
      else if (id === 'oDur') o.durUnit = v; else if (id === 'oHpd') o.hoursPerDay = +v || 8; else if (id === 'oBL') o.baseline = v; else return;
      parse();
    };
    if (droppedFile) take(droppedFile);
  };

  /* ---------- progress update (like P6 Update Progress) ---------- */
  D.progress = () => {
    const P = S.P;
    D.open('Update progress', '<p class="small">Moves the data date and records progress <b>as planned</b>: work scheduled before the new data date gets actual dates; activities still running get their remaining duration from the schedule. Review and correct actuals afterwards.</p>' +
      '<div class="form"><div class="f"><label for="uDD">New data date</label><input type="date" id="uDD" value="' + iso(P.dataDate + 7) + '"></div><div class="f"><label>Current data date</label><div class="ro">' + f(P.dataDate) + '</div></div></div>',
      [{ label: 'Cancel' }, { label: 'Update', cls: 'pri', act: () => {
        const ND = E.parseDate($('uDD').value); if (ND == null) { U.toast('Pick a date'); return false; } let n = 0;
        U.change(P2 => {
          P2.activities.forEach((a, i) => {
            const r = S.R.rows[i]; if (U.isW(a) || !r || r.loop || r.st === 2) return;
            const cs = S.R.cs, k = r.k;
            if (r.st === 0 && r.start < ND) { a.as = r.start; n++; }
            if (r.finish < ND) { if (a.as == null) a.as = r.start; a.af = r.finish; a.pct = 100; delete a.rdo; n++; }
            else if (a.as != null && r.tc === 0) { a.rdo = Math.max(1, cs.cum(k, r.finish) - cs.cum(k, ND - 1)); const od = +a.od || 1; a.pct = Math.max(0, Math.min(99, Math.round((1 - a.rdo / od) * 100))); }
          });
          P2.dataDate = ND;
        });
        U.toast('Data date moved to ' + f(ND) + ' - ' + n + ' activities progressed');
      } }]);
  };

  /* ---------- schedule health & log ---------- */
  D.log = () => {
    const P = S.P, R = S.R, cs = R.cs, dk = R.defK, rows = R.rows.filter(r => !r.wbs && !r.loop), inc = rows.filter(r => r.st < 2), tasks = inc.filter(r => r.tc === 0), okRels = R.rels.filter(r => r.ok);
    const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;
    const cpLen = Math.max(1, cs.cum(dk, R.PFE) - cs.cum(dk, P.dataDate - 1)), minTF = inc.reduce((m, r) => Math.min(m, r.TF), Infinity);
    const blDue = rows.filter(r => r.blf != null && r.blf < P.dataDate);
    const checks = [
      ['Missing logic (no pred. or succ.)', pct(inc.filter(r => !r.inc.length || !r.out.length).length, inc.length), '%', v => v <= 5, '<= 5%'],
      ['Leads (negative lags)', okRels.filter(r => r.L < 0).length, '', v => v === 0, '0'],
      ['Lags (positive)', pct(okRels.filter(r => r.L > 0).length, okRels.length), '%', v => v <= 5, '<= 5%'],
      ['Finish-to-Start links', pct(okRels.filter(r => r.T === 1).length, okRels.length), '%', v => v >= 90, '>= 90%'],
      ['Hard constraints', pct(inc.filter(r => [3, 4, 7, 8].includes(r.ct)).length, inc.length), '%', v => v <= 5, '<= 5%'],
      ['High float (> 44 d)', pct(inc.filter(r => r.TF > 44).length, inc.length), '%', v => v <= 5, '<= 5%'],
      ['Negative float', inc.filter(r => r.TF < 0).length, '', v => v === 0, '0'],
      ['High duration (> 44 d)', pct(tasks.filter(r => +r.a.od > 44).length, tasks.length), '%', v => v <= 5, '<= 5%'],
      ['Invalid dates (actual after data date)', rows.filter(r => (r.as != null && r.as >= P.dataDate) || (r.af != null && r.af >= P.dataDate)).length, '', v => v === 0, '0'],
      ['Missed tasks (BL finish passed, late)', pct(blDue.filter(r => r.af == null || r.af > r.blf).length, blDue.length), '%', v => v <= 5, '<= 5%'],
      ['Critical Path Length Index', isFinite(minTF) ? Math.round((cpLen + minTF) / cpLen * 100) / 100 : '-', '', v => v === '-' || v >= 0.95, '>= 0.95'],
      ['Baseline Execution Index', blDue.length ? Math.round(rows.filter(r => r.af != null && r.blf != null && r.blf < P.dataDate).length / blDue.length * 100) / 100 : '-', '', v => v === '-' || v >= 0.95, '>= 0.95']];
    const k = [['Activities', R.stats.acts], ['Relationships', R.stats.rels], ['Critical', R.stats.crit, R.stats.crit ? 'warn' : ''], ['Longest path', R.stats.lp], ['Negative float', R.stats.neg, R.stats.neg ? 'bad' : 'good'],
      ['In loops', R.stats.loops, R.stats.loops ? 'bad' : 'good'], ['Completed', R.stats.done], ['In progress', R.stats.prog], ['Not started', R.stats.ns], ['Finish', f(R.PFE)]];
    const lv = { err: 0, warn: 1, info: 2 };
    const log = R.log.slice().sort((a, b) => lv[a.lvl] - lv[b.lvl]);
    D.open('Schedule health & log', '<div class="kpis">' + k.map(([l, v, c]) => '<div class="kpi ' + (c || '') + '"><b>' + esc(v) + '</b><span>' + l + '</span></div>').join('') + '</div>' +
      '<h3 style="margin:4px 0 0;font:700 15px var(--f-disp)">Quality checks (DCMA 14-point style)</h3><div class="chk">' + checks.map(([l, v, u, ok, t]) => { const pass = ok(v); return '<span class="pill ' + (pass ? 'pass' : 'fail') + '">' + (pass ? 'PASS' : 'CHECK') + '</span><span>' + l + ' <span class="muted small">target ' + t + '</span></span><b style="font-variant-numeric:tabular-nums">' + esc(v) + u + '</b>'; }).join('') + '</div>' +
      '<h3 style="margin:4px 0 0;font:700 15px var(--f-disp)">Scheduling log (' + log.length + ')</h3><ul class="log">' + (log.length ? log.map(l => '<li class="' + l.lvl + '"' + (l.id ? ' data-find="' + esc(l.id) + '" style="cursor:pointer"' : '') + '>' + esc(l.msg) + '</li>').join('') : '<li class="info">No messages</li>') + '</ul>',
      [{ label: 'Close', cls: 'pri' }], m => { m.querySelectorAll('[data-find]').forEach(li => li.addEventListener('click', () => { const i = U.idx(li.dataset.find); if (i >= 0) { D.close(); U.reveal(i); } })); }, true);
  };

  /* ---------- columns ---------- */
  D.columns = () => {
    const st = U.grid.colState();
    D.open('Columns', '<p class="small muted">Choose the columns shown in the activity table (order follows P6 layout).</p><div class="kpis" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))">' +
      U.grid.cols.map(c => '<label class="chip" style="border-radius:6px;padding:6px 8px;cursor:pointer"><input type="checkbox" data-col="' + c.k + '"' + (st.vis.includes(c.k) ? ' checked' : '') + (c.k === 'id' || c.k === 'name' ? ' disabled' : '') + '> ' + esc(c.label) + '</label>').join('') + '</div>',
      [{ label: 'Cancel' }, { label: 'Apply', cls: 'pri', act: () => { const keys = U.grid.cols.map(c => c.k).filter(k => k === 'id' || k === 'name' || document.querySelector('[data-col="' + k + '"]').checked); U.grid.setVisible(keys); } }]);
  };

  /* ---------- help ---------- */
  D.help = () => D.open('How CPM Forge works', '<div class="cols2"><div><h3 style="margin:0 0 6px;font:700 15px var(--f-disp)">Scheduling engine</h3><p class="small">Critical Path Method exactly like the Excel workbook it exports: forward and backward pass on working-day calendars (work week + holidays + extra working days), FS / SS / FF / SF links with leads and lags, start and finish milestones, constraints (Start/Finish On or After / On or Before / On, Mandatory, As Late As Possible), actuals with Retained Logic or Progress Override, total and free float, driving links and the longest path.</p>' +
    '<h3 style="margin:10px 0 6px;font:700 15px var(--f-disp)">From Primavera P6</h3><p class="small"><b>XER</b>: File &gt; Export &gt; Primavera PM (XER) - brings WBS, calendars with holidays, logic, actuals and planned dates.<br><b>Excel</b>: File &gt; Export &gt; Spreadsheet (XLSX), pick <i>Activities</i> and <i>Activity Relationships</i>. Calendar names come across; set their work weeks and holidays in Calendars.<br><b>Paste</b>: copy rows from a P6 layout or Excel (with a header row).</p>' +
    '<h3 style="margin:10px 0 6px;font:700 15px var(--f-disp)">Excel export</h3><p class="small">Export Excel gives a macro-free workbook where every date is a live formula (Excel 2019 / 2021 / 365). Edit durations, logic, actuals or calendars there and it recalculates like this app.</p></div>' +
    '<div><h3 style="margin:0 0 6px;font:700 15px var(--f-disp)">Keys</h3><table class="tbl"><tbody>' + [['← ↑ ↓ →', 'Move the cell cursor (like Excel / P6)'], ['Home / End', 'First / last column'], ['Ctrl+Home / Ctrl+End', 'First / last row'], ['Type any key', 'Start editing the cell with that text'], ['Enter / F2 / double-click', 'Edit cell (F2 keeps the text)'],
      ['Enter / Shift+Enter', 'Save and move down / up'], ['Tab / Shift+Tab', 'Save and move right / left'], ['Esc', 'Cancel the edit'], ['Backspace', 'Clear and edit the cell'],
      ['+ / − / *', 'Expand / collapse / expand whole branch (on a WBS row)'], ['Space', 'Toggle a WBS row'], ['Ctrl+← / Ctrl+→', 'Collapse (or go to parent) / expand'], ['Alt+1..9 / Alt+0', 'Show outline to level n / expand all'], ['Ctrl+Shift+− / +', 'Collapse / expand one level'],
      ['Shift+↑↓, Shift+click, Ctrl+click', 'Select several rows'], ['Ctrl+L / Ctrl+Shift+L', 'Link selected (FS chain) / unlink'], ['Ctrl+D', 'Fill down'], ['Ctrl+C / Ctrl+V', 'Copy / paste cells (works with Excel)'],
      ['Ctrl+[ / Ctrl+]', 'Go to driving predecessor / successor'], ['Ctrl+K', 'Command palette - any command or jump to an activity'], ['Ctrl+Enter', 'Activity details'], ['F9', 'Schedule now'], ['Insert / Ctrl+Insert', 'Add activity / WBS below'], ['Delete', 'Delete selected row(s)'],
      ['Ctrl+Z / Ctrl+Y', 'Undo / Redo'], ['Ctrl+S', 'Save project file'], ['Ctrl+I', 'Import'], ['Ctrl + mouse wheel', 'Zoom the Gantt'], ['Right-click', 'Row menu']].map(r => '<tr><td><b>' + r[0] + '</b></td><td>' + r[1] + '</td></tr>').join('') + '</tbody></table>' +
    '<h3 style="margin:10px 0 6px;font:700 15px var(--f-disp)">Gantt</h3><div class="legend"><span><i style="background:var(--bar)"></i>Remaining</span><span><i style="background:var(--crit)"></i>Critical</span><span><i style="background:var(--act)"></i>Actual</span><span><i style="background:var(--bl);height:4px"></i>Baseline</span><span><i style="background:var(--sum)"></i>WBS</span><span><i style="background:var(--dd);width:3px"></i>Data date</span></div>' +
    '<p class="small"><b>Smart entry.</b> Durations: <code>10</code>, <code>2w</code>, <code>16h</code>, <code>1m</code>. Dates: <code>15-Oct-26</code>, <code>15/10/2026</code>, <code>15</code> (day this month), <code>t</code> (today), <code>dd</code> (data date), <code>+5</code> / <code>-2w</code> (shift the current date). <code>%</code> = 100 marks the activity complete.</p><p class="small">Predecessor / Successor columns accept text like <code>A1000, A1010 SS +2, A1020 FF -1</code>. Typing a Start date on a not-started activity adds a Start On or After constraint; typing a Finish changes its duration.</p><p class="small muted">Your schedule is kept in this browser automatically. Use File &gt; Save project file to keep a copy.</p></div></div>', [{ label: 'Close', cls: 'pri' }], null, true);

  /* ---------- filters + command palette ---------- */
  U.setFilter = m => { S.fMode = m; $('fMode').value = m; U.buildRows(); U.grid.render(); U.gantt.render(true); };
  const PCMDS = [
    ['Schedule now (F9)', 'f9', 'Schedule'], ['Add activity below', 'add', 'Edit'], ['Add WBS below', 'addWbs', 'Edit'], ['Delete selected', 'del', 'Edit'], ['Fill down', 'fill', 'Edit'],
    ['Link selected activities (FS chain)', 'link', 'Logic'], ['Link selected activities (SS)', 'linkSS', 'Logic'], ['Unlink selected activities', 'unlink', 'Logic'],
    ['Go to driving predecessor', 'tp', 'Logic'], ['Go to driving successor', 'ts', 'Logic'],
    ['Expand all WBS', 'expandAll', 'Outline'], ['Collapse to level 1', 'c1', 'Outline'], ['Collapse to level 2', 'c2', 'Outline'], ['Collapse to level 3', 'c3', 'Outline'], ['Collapse one level', 'lvDown', 'Outline'], ['Expand one level', 'lvUp', 'Outline'],
    ['Show critical activities', 'fCrit', 'Filter'], ['Show open ends (missing logic)', 'fOpen', 'Filter'], ['Show negative float', 'fNeg', 'Filter'], ['Show late vs baseline', 'fLate', 'Filter'], ['Show all activities', 'fAll', 'Filter'],
    ['Set baseline = current dates', 'baseline', 'Schedule'], ['Update progress to a new data date', 'progress', 'Schedule'], ['Project settings', 'proj', 'Schedule'], ['Calendars', 'cal', 'Schedule'], ['Schedule health & log', 'log', 'Schedule'],
    ['Import P6 (XER / Excel / CSV)', 'import', 'File'], ['Paste activity table', 'paste', 'File'], ['Export Excel scheduler (.xlsx)', 'xlsx', 'File'], ['Export XER for P6', 'xer', 'File'], ['Export activity table (.csv)', 'csv', 'File'], ['Save project file (.json)', 'json', 'File'],
    ['Columns', 'cols', 'View'], ['Go to data date', 'goDD', 'View'], ['Relationship lines on/off', 'tRel', 'View'], ['Baseline bars on/off', 'tBL', 'View'], ['Float bars on/off', 'tFloat', 'View'], ['Dark / light theme', 'theme', 'View'], ['Help & shortcuts', 'help', 'View'],
    ['Undo', 'undo', 'Edit'], ['Redo', 'redo', 'Edit'], ['New blank project', 'newProject', 'File'], ['Load demo schedule', 'demo', 'File']];
  U.palette = () => {
    if (document.querySelector('.pal')) return;
    const back = document.activeElement;
    const el = document.createElement('div'); el.className = 'pal';
    el.innerHTML = '<div role="dialog" aria-label="Command palette"><input id="palIn" placeholder="Type a command, or an activity ID / name to jump to it..." aria-label="Command or activity"><ul id="palList" role="listbox"></ul></div>';
    document.body.appendChild(el);
    const inp = $('palIn'), ul = $('palList'); let items = [], at = 0;
    const score = (hay, q) => { hay = hay.toLowerCase(); if (!q) return 1; const p = hay.indexOf(q); if (p >= 0) return 100 - p; let j = 0; for (const ch of hay) if (ch === q[j]) j++; return j === q.length ? 10 : 0; };
    const draw = () => {
      const q = inp.value.trim().toLowerCase();
      const cmds = PCMDS.map(c => ({ kind: 'cmd', t: c[0], g: c[2], run: c[1], s: score(c[0] + ' ' + c[2], q) })).filter(x => x.s > 0);
      let acts = [];
      if (q) S.P.activities.forEach((a, i) => { const sc = Math.max(score(U.isW(a) ? a.wbs : a.id, q) * 2, score(a.name || '', q)); if (sc > 0) acts.push({ kind: 'act', t: (U.isW(a) ? 'WBS ' + a.wbs : a.id) + '  ' + (a.name || ''), g: U.isW(a) ? 'WBS' : 'Activity', i, s: sc }); });
      acts.sort((x, y) => y.s - x.s); cmds.sort((x, y) => y.s - x.s);
      items = (q && acts.length && acts[0].s >= cmds.concat([{ s: 0 }])[0].s ? acts.slice(0, 12).concat(cmds.slice(0, 8)) : cmds.slice(0, 14).concat(acts.slice(0, 10)));
      at = Math.min(at, Math.max(0, items.length - 1));
      ul.innerHTML = items.length ? items.map((x, n) => '<li role="option" data-n="' + n + '" aria-selected="' + (n === at) + '"><span><span class="k">' + U.esc(x.g) + '</span>' + U.esc(x.t) + '</span>' + (x.kind === 'act' ? '<small>jump</small>' : '') + '</li>').join('') : '<li class="muted">No match</li>';
      const sel = ul.querySelector('[aria-selected="true"]'); if (sel) sel.scrollIntoView({ block: 'nearest' });
    };
    const close = () => { el.remove(); if (back && back.focus) back.focus({ preventScroll: true }); else $('gBody').focus(); };
    const exec = n => { const x = items[n]; if (!x) return; el.remove(); if (x.kind === 'act') { U.reveal(x.i); $('gBody').focus({ preventScroll: true }); } else { $('gBody').focus({ preventScroll: true }); U.run(x.run); } };
    inp.addEventListener('input', () => { at = 0; draw(); });
    inp.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'ArrowDown') { e.preventDefault(); at = Math.min(items.length - 1, at + 1); draw(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); at = Math.max(0, at - 1); draw(); }
      else if (e.key === 'Enter') { e.preventDefault(); exec(at); }
      else if (e.key === 'Escape') { e.preventDefault(); close(); }
    });
    ul.addEventListener('click', e => { const li = e.target.closest('[data-n]'); if (li) exec(+li.dataset.n); });
    el.addEventListener('mousedown', e => { if (e.target === el) close(); });
    draw(); inp.focus();
  };

  /* ---------- boot ---------- */
  U.setView = v => { $('main').dataset.view = v; document.querySelectorAll('.vtabs [data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v))); if (v === 'details') { S.drawer = true; U.details.render(); } setTimeout(() => { U.grid.paint(); U.gantt.render(true); }, 0); };
  function boot() {
    try { const th = localStorage.getItem('cpmforge.v1.theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) { /* ignore */ }
    const saved = U.restore();
    if (saved && saved.ui) { S.ts = saved.ui.ts || 'Week'; S.zoom = saved.ui.zoom || 1; ['showRel', 'showBL', 'showFloat', 'showLabels'].forEach(k => { if (saved.ui[k] != null) S[k] = saved.ui[k]; }); U.grid.setColState(saved.ui.cols); $('fTs').value = S.ts; }
    if (window.matchMedia('(max-width:760px)').matches && !(saved && saved.ui && saved.ui.cols)) U.grid.setColState({ vis: ['id', 'name', 'od', 'start', 'finish', 'tf', 'crit'] });
    try { if (saved) U.load(saved.P, { demo: saved.demo, collapsed: saved.ui && saved.ui.collapsed, level: saved.ui && saved.ui.level, keepTs: true }); else U.load(window.P6Sample(), { demo: true }); }
    catch (e) { console.error(e); U.load(window.P6Sample(), { demo: true }); }
    const on = (id, fn) => $(id).addEventListener('click', fn);
    on('btnF9', U.cmd.f9); on('btnImport', () => D.import()); on('btnXlsx', U.exportXlsx); on('btnAdd', U.cmd.add); on('btnAddW', U.cmd.addWbs); on('btnDel', U.cmd.del);
    on('btnUndo', U.undo); on('btnRedo', U.redo); on('btnCal', () => D.calendars()); on('btnProj', () => D.project()); on('btnLog', () => D.log()); on('btnHelp', () => D.help());
    on('zIn', () => U.gantt.zoom(1.25)); on('zOut', () => U.gantt.zoom(0.8)); on('btnPal', () => U.palette());
    $('lvlBar').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.lvstep) U.cmd.levelStep(+b.dataset.lvstep); else U.cmd.collapseTo(+b.dataset.lv); $('gBody').focus({ preventScroll: true }); });
    document.querySelectorAll('[data-flt]').forEach(c => c.addEventListener('click', () => U.setFilter(S.fMode === c.dataset.flt ? 'all' : c.dataset.flt)));
    setTimeout(() => { const h = $('gHint'); if (h) h.hidden = true; }, 12000);
    $('gBody').focus({ preventScroll: true });
    $('fMode').onchange = e => { S.fMode = e.target.value; U.buildRows(); U.grid.render(); U.gantt.render(true); };
    let tt; $('fText').oninput = e => { clearTimeout(tt); tt = setTimeout(() => { S.fText = e.target.value; U.buildRows(); U.grid.render(); U.gantt.render(true); }, 180); };
    $('fSort').onchange = e => { S.sort = e.target.value; U.buildRows(); U.grid.render(); U.gantt.render(true); };
    $('fTs').onchange = e => { S.ts = e.target.value; S.zoom = 1; const mid = S.P.dataDate - 14; U.gantt.scrollToDate(mid); U.persist(); };
    document.querySelectorAll('.vtabs [data-view]').forEach(b => b.addEventListener('click', () => U.setView(b.dataset.view)));
    const sp = $('splitter'), gp = $('gridPane');
    sp.addEventListener('pointerdown', e => { e.preventDefault(); const x0 = e.clientX, w0 = gp.getBoundingClientRect().width, mw = $('main').getBoundingClientRect().width;
      const mv = ev => { gp.style.width = Math.max(180, Math.min(mw - 180, w0 + ev.clientX - x0)) + 'px'; U.grid.paint(); U.gantt.render(); };
      const up = () => { window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); };
      window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); });
    sp.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { const w = gp.getBoundingClientRect().width + (e.key === 'ArrowLeft' ? -30 : 30); gp.style.width = Math.max(180, w) + 'px'; U.grid.paint(); U.gantt.render(); } });
    window.addEventListener('dragover', e => { if ([...(e.dataTransfer.items || [])].some(x => x.kind === 'file')) e.preventDefault(); });
    window.addEventListener('drop', e => { if (e.target.closest && e.target.closest('#iDrop')) return; const fl = e.dataTransfer.files && e.dataTransfer.files[0]; if (fl) { e.preventDefault(); D.import(false, fl); } });
  }
  boot();
})();

</script>
