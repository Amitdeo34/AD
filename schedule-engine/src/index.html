<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedule Engine</title>
<meta name="description" content="Schedule Engine - offline monthly schedule updater for Primavera P6 XER, Excel and PDF schedules.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2300338D'/%3E%3Crect x='6' y='8' width='13' height='4' rx='1' fill='%23fff'/%3E%3Crect x='11' y='14' width='15' height='4' rx='1' fill='%230091DA'/%3E%3Crect x='8' y='20' width='9' height='4' rx='1' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<!--@CSS-->
<link rel="stylesheet" href="ui/styles.css">
<!--@/CSS-->
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#fff" fill-opacity=".14"/><rect x="5" y="7" width="13" height="4" rx="1" fill="#fff"/><rect x="11" y="14" width="16" height="4" rx="1" fill="#0091DA"/><rect x="7" y="21" width="9" height="4" rx="1" fill="#fff"/><path d="M21 5v22" stroke="#FF6B6B" stroke-width="1.6" stroke-dasharray="2 2"/></svg>
      <div><b>Schedule Engine</b><small>Monthly update workbench</small></div>
    </div>
    <div class="projinfo">
      <span class="pname" id="pname">No project loaded</span>
      <button class="chip" id="ddChip" title="Change the Data Date">Data Date: —</button>
      <span class="chip" id="schedChip" hidden></span>
    </div>
    <div class="ask" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="ask" type="search" placeholder="Ask the engine: delayed in Admin Building, procurement progress…" aria-label="Ask the engine" autocomplete="off">
    </div>
    <select id="themeSel" aria-label="Theme">
      <option value="kpmg">KPMG India theme</option>
      <option value="kpmg-dark">KPMG India - dark</option>
      <option value="p6">Primavera classic</option>
    </select>
    <button class="topbtn" id="helpBtn" title="Help & shortcuts">?</button>
  </header>

  <nav class="ribbon" id="ribbon">
    <div class="rtabs" role="tablist">
      <button role="tab" data-rt="home" aria-selected="true">Home</button>
      <button role="tab" data-rt="update" aria-selected="false">Update</button>
      <button role="tab" data-rt="view" aria-selected="false">View</button>
      <button role="tab" data-rt="analyze" aria-selected="false">Analyze</button>
    </div>
    <div class="rpanel" data-rp="home"></div>
    <div class="rpanel" data-rp="update" hidden></div>
    <div class="rpanel" data-rp="view" hidden></div>
    <div class="rpanel" data-rp="analyze" hidden></div>
  </nav>

  <div class="wizard" id="wizard"></div>

  <div class="main" id="main">
    <aside class="side" id="side"></aside>
    <section class="workspace">
      <div class="vtabs" id="vtabs">
        <button data-view="gantt" aria-selected="true">Schedule &amp; Gantt</button>
        <button data-view="easy" aria-selected="false">Easy Update</button>
        <button data-view="dash" aria-selected="false">Dashboard</button>
        <button data-view="health" aria-selected="false">Health Check</button>
        <button data-view="changes" aria-selected="false">Changes</button>
        <button data-view="qty" aria-selected="false">Qty &amp; Liquidation</button>
        <span class="spacer"></span>
        <div class="filterbar" id="filterbar"></div>
      </div>
      <div class="view" id="view-gantt">
        <div class="split" id="split">
          <div class="grid" id="grid">
            <div class="ghead" id="ghead"></div>
            <div class="gbody" id="gbody" tabindex="0"><div class="gspacer" id="gspacer"><div class="grows" id="grows"></div></div></div>
          </div>
          <div class="splitter" id="splitter" title="Drag to resize"></div>
          <div class="gantt" id="gantt">
            <div class="ganttHead" id="ganttHead"><canvas id="ganttHeadCanvas"></canvas></div>
            <div class="ganttBody" id="ganttBody"><div class="gspace" id="gspace"></div><canvas id="ganttCanvas"></canvas></div>
          </div>
        </div>
        <div class="details" id="details"></div>
      </div>
      <div class="view" id="view-easy" hidden></div>
      <div class="view" id="view-dash" hidden></div>
      <div class="view" id="view-health" hidden></div>
      <div class="view" id="view-changes" hidden></div>
      <div class="view" id="view-qty" hidden></div>
    </section>
  </div>
  <footer class="statusbar" id="statusbar"></footer>
</div>

<div class="welcome" id="welcome"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="tip" id="tip" hidden></div>
<input type="file" id="fileIn" hidden accept=".xer,.xlsx,.xls,.xlsm,.csv,.pdf,.xml,.sej,.json">

<!--@VENDOR-->
<script src="../vendor/xlsx.full.min.js"></script>
<script src="../vendor/exceljs.min.js"></script>
<script src="../vendor/jspdf.umd.min.js"></script>
<script src="../vendor/jspdf.plugin.autotable.min.js"></script>
<script src="../vendor/pdf.min.js"></script>
<script src="../vendor/pdf.worker.min.js"></script>
<script src="../vendor/pptxgen.bundle.js"></script>
<!--@/VENDOR-->
<!--@JS-->
<script src="core/base.js"></script>
<script src="core/model.js"></script>
<script src="core/cpm.js"></script>
<script src="core/xer.js"></script>
<script src="core/analysis.js"></script>
<script src="core/views.js"></script>
<script src="core/importers.js"></script>
<script src="core/exporters.js"></script>
<script src="core/demo.js"></script>
<script src="core/qty.js"></script>
<script src="core/qtyexport.js"></script>
<script src="ui/app.js"></script>
<script src="ui/grid.js"></script>
<script src="ui/gantt.js"></script>
<script src="ui/panels.js"></script>
<script src="ui/io.js"></script>
<script src="ui/qtyview.js"></script>
<script src="ui/boot.js"></script>
<!--@/JS-->
</body>
</html>
